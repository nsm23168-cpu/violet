  - name: Add style analysis
    if: steps.chk.outputs.ok == '1'
    run: |
     # 그림체 분석: 작은 이미지 AI 모델(MobileNet V3, 약 4MB)을 앱에 넣어요.
     M=android/app/src/main/assets/violet_style.tflite
     mkdir -p android/app/src/main/assets
     rm -f "$M"
     for u in \
       "https://huggingface.co/litert-community/MediaPipe-ImageEmbedder-MobileNet-V3-Small/resolve/main/mobilenet_v3_small.tflite" \
       "https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/latest/mobilenet_v3_small.tflite"; do
       if curl -fsSL --retry 3 --max-time 180 -o "$M" "$u" && [ "$(stat -c %s "$M" 2>/dev/null || echo 0)" -gt 100000 ]; then
         echo "그림체 모델 받음: $u"
         break
       fi
       rm -f "$M"
     done
     if [ ! -s "$M" ]; then
       echo "그림체 모델을 못 받아서 이번엔 그림체 분석 없이 만들어요"
       exit 0
     fi
     sha256sum "$M"
     MA=$(find android/app/src/main -name MainActivity.kt | head -n 1)
     if [ -z "$MA" ]; then
       rm -f "$M"
       echo "MainActivity.kt 를 못 찾아서 그림체 분석은 빼요"
       exit 0
     fi
     PKG=$(grep -m1 -E '^package ' "$MA" | awk '{print $2}')
     KT="$(dirname "$MA")/VioletStyle.kt"
     # 빌드가 실패하면 그림체 없이 다시 만들 수 있게 원래 파일을 보관해요.
     B="$RUNNER_TEMP/style_backup"
     rm -rf "$B"
     mkdir -p "$B"
     cp "$MA" "$B/MainActivity.kt"
     cp android/app/build.gradle.kts "$B/build.gradle.kts"
     cp android/app/proguard-rules.pro "$B/proguard-rules.pro"
     echo "$MA" > "$B/ma_path"
     echo "$KT" > "$B/kt_path"
     cat > "$KT" <<'KOTLIN'
     package __PKG__

     import android.content.Context
     import android.graphics.Bitmap
     import android.graphics.BitmapFactory
     import android.os.Handler
     import android.os.Looper
     import com.google.mediapipe.framework.image.BitmapImageBuilder
     import com.google.mediapipe.tasks.core.BaseOptions
     import com.google.mediapipe.tasks.vision.imageembedder.ImageEmbedder
     import io.flutter.plugin.common.MethodCall
     import io.flutter.plugin.common.MethodChannel
     import java.util.concurrent.Executors

     // [AI 추천] 그림체 분석: 표지 그림을 작은 이미지 AI(MobileNet V3)로 '그림 지문'으로 바꿔요.
     object VioletStyle {
         private const val MODEL = "violet_style.tflite"
         private val worker = Executors.newSingleThreadExecutor()
         private val main = Handler(Looper.getMainLooper())
         private var embedder: ImageEmbedder? = null
         private var failed = false

         private fun get(ctx: Context): ImageEmbedder? {
             if (embedder != null || failed) return embedder
             try {
                 val base = BaseOptions.builder().setModelAssetPath(MODEL).build()
                 val options = ImageEmbedder.ImageEmbedderOptions.builder()
                     .setBaseOptions(base)
                     .build()
                 embedder = ImageEmbedder.createFromOptions(ctx, options)
             } catch (t: Throwable) {
                 failed = true
             }
             return embedder
         }

         private fun embed(ctx: Context, bytes: ByteArray): ByteArray? {
             val e = get(ctx) ?: return null
             val src = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: return null
             val bmp = if (src.config == Bitmap.Config.ARGB_8888) src else src.copy(Bitmap.Config.ARGB_8888, false)
             try {
                 val result = e.embed(BitmapImageBuilder(bmp).build())
                 val emb = result.embeddingResult().embeddings().firstOrNull() ?: return null
                 val f = emb.floatEmbedding()
                 if (f == null || f.isEmpty()) {
                     val q = emb.quantizedEmbedding()
                     return if (q == null || q.isEmpty()) null else q
                 }
                 var mx = 0f
                 for (x in f) {
                     val a = Math.abs(x)
                     if (a > mx) mx = a
                 }
                 if (mx <= 0f) return null
                 return ByteArray(f.size) { i -> Math.round(f[i] / mx * 127f).coerceIn(-127, 127).toByte() }
             } finally {
                 if (bmp !== src) bmp.recycle()
                 src.recycle()
             }
         }

         fun handle(ctx: Context, call: MethodCall, result: MethodChannel.Result) {
             when (call.method) {
                 "available" -> worker.execute {
                     val ok = try { get(ctx) != null } catch (t: Throwable) { false }
                     main.post { result.success(ok) }
                 }
                 "embed" -> {
                     val bytes = call.argument<ByteArray>("bytes")
                     if (bytes == null) {
                         result.success(null)
                         return
                     }
                     worker.execute {
                         val out = try { embed(ctx, bytes) } catch (t: Throwable) { null }
                         main.post { result.success(out) }
                     }
                 }
                 else -> result.notImplemented()
             }
         }
     }
     KOTLIN
     sed -i "s/^package __PKG__\$/package $PKG/" "$KT"
     if python3 - "$MA" "$KT" "$M" <<'PY'
     import os
     import sys

     ma, kt, model = sys.argv[1:4]
     s = open(ma, encoding='utf-8').read()
     anchor = 'GeneratedPluginRegistrant.registerWith(flutterEngine)\n'
     add = (
         '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "xyz.project.violet/style").setMethodCallHandler { call, result ->\n'
         '            VioletStyle.handle(applicationContext, call, result)\n'
         '        }\n'
     )
     if 'VioletStyle.handle' not in s:
         if anchor not in s or 'import io.flutter.plugin.common.MethodChannel\n' not in s:
             print('MainActivity 모양이 달라서 그림체 분석은 빼요')
             sys.exit(3)
         s = s.replace(anchor, anchor + add, 1)
         open(ma, 'w', encoding='utf-8').write(s)
     g = 'android/app/build.gradle.kts'
     t = open(g, encoding='utf-8').read()
     if 'tasks-vision' not in t:
         t += '''
     dependencies {
         implementation("com.google.mediapipe:tasks-vision:0.10.26")
     }

     android {
         androidResources {
             noCompress += listOf("tflite")
         }
         packaging {
             jniLibs {
                 pickFirsts += listOf("**/libc++_shared.so")
             }
         }
     }
     '''
         open(g, 'w', encoding='utf-8').write(t)
     pr = 'android/app/proguard-rules.pro'
     r = open(pr, encoding='utf-8').read()
     if 'com.google.mediapipe' not in r:
         r += '''
     -keep class com.google.mediapipe.** { *; }
     -dontwarn com.google.mediapipe.**
     -keep class com.google.protobuf.** { *; }
     -dontwarn com.google.protobuf.**
     -keep class com.google.common.flogger.** { *; }
     -dontwarn com.google.common.**
     -dontwarn com.google.auto.value.**
     -dontwarn javax.annotation.**
     -dontwarn javax.lang.model.**
     -dontwarn org.checkerframework.**
     -dontwarn com.google.errorprone.annotations.**
     -dontwarn com.google.j2objc.annotations.**
     '''
         open(pr, 'w', encoding='utf-8').write(r)
     PY
     then
       touch "$B/applied"
       echo "그림체 분석 추가 완료"
     else
       cp "$B/MainActivity.kt" "$MA"
       cp "$B/build.gradle.kts" android/app/build.gradle.kts
       cp "$B/proguard-rules.pro" android/app/proguard-rules.pro
       rm -f "$KT" "$M"
       echo "그림체 분석은 이번엔 빼요"
     fi
  - name: Use the official Rust library
    id: rust
    if: steps.chk.outputs.ok == '1'
    env:
     GH_TOKEN: ${{ github.token }}
     SRC_TAG: ${{ steps.src.outputs.tag }}
    run: |
     # 윈도우 전용 경로 설정을 지워요 (리눅스에서 Rust 빌드가 깨지는 원인)
     sed -i -E '/environment[[:space:]]+"(RUSTUP_HOME|CARGO_HOME)"/d' rust_builder/cargokit/gradle/plugin.gradle
     D="$RUNNER_TEMP/official"
     P="$RUNNER_TEMP/prebuilt"
     rm -rf "$D" "$P"
     mkdir -p "$D"
     if [ "$SRC_TAG" != "dev" ]; then
       gh release download "$SRC_TAG" --repo hanyuec8/violet-lite --pattern '*.apk' --dir "$D" || echo "공식 APK를 못 받았어요 (Rust는 직접 만들어요)"
     fi
     python3 -I - "$D" "$P/arm64-v8a/librust_lib_violet.so" lib/src/rust/frb_generated.dart <<'PY'
     import glob
     import os
     import re
     import struct
     import sys
     import zipfile

     apk_dir, out_path, dart_frb = sys.argv[1:4]
     LIB = 'lib/arm64-v8a/librust_lib_violet.so'

     want = None
     try:
         m = re.search(r'rustContentHash\s*=>\s*(-?\d+)', open(dart_frb, encoding='utf-8').read())
         if m:
             want = int(m.group(1))
     except OSError:
         pass


     def frb_hash(d):
         if d[:4] != b'\x7fELF' or d[4] != 2 or d[5] != 1:
             return None
         shoff = struct.unpack_from('<Q', d, 0x28)[0]
         shentsize, shnum = struct.unpack_from('<HH', d, 0x3A)
         secs = [struct.unpack_from('<IIQQQQIIQQ', d, shoff + i * shentsize) for i in range(shnum)]
         phoff = struct.unpack_from('<Q', d, 0x20)[0]
         phentsize, phnum = struct.unpack_from('<HH', d, 0x36)
         for _, typ, _, _, off, size, link, _, _, entsize in secs:
             if typ != 11 or not entsize:
                 continue
             stroff = secs[link][4]
             for j in range(size // entsize):
                 st_name, _, _, _, st_value, _ = struct.unpack_from('<IBBHQQ', d, off + j * entsize)
                 a = stroff + st_name
                 if d[a:d.index(b'\0', a)] != b'frb_get_rust_content_hash':
                     continue
                 fo = None
                 for k in range(phnum):
                     p_type, _, p_off, p_vaddr, _, p_filesz, _, _ = struct.unpack_from('<IIQQQQQQ', d, phoff + k * phentsize)
                     if p_type == 1 and p_vaddr <= st_value < p_vaddr + p_filesz:
                         fo = p_off + st_value - p_vaddr
                         break
                 if fo is None:
                     return None
                 val = None
                 for w in struct.unpack_from('<4I', d, fo):
                     if w == 0xD65F03C0:
                         break
                     if (w >> 23) & 0x3F == 0x25:
                         opc, hw, imm = (w >> 29) & 3, (w >> 21) & 3, (w >> 5) & 0xFFFF
                         if opc == 2:
                             val = imm << (16 * hw)
                         elif opc == 3 and val is not None:
                             val = (val & ~(0xFFFF << (16 * hw))) | (imm << (16 * hw))
                         elif opc == 0:
                             val = ~(imm << (16 * hw)) & 0xFFFFFFFF
                 if val is None:
                     return None
                 val &= 0xFFFFFFFF
                 return val - (1 << 32) if val >= 1 << 31 else val
         return None


     for apk in sorted(glob.glob(os.path.join(apk_dir, '*.apk'))):
         try:
             with zipfile.ZipFile(apk) as z:
                 data = z.read(LIB)
         except (KeyError, zipfile.BadZipFile, OSError):
             continue
         got = frb_hash(data)
         print(os.path.basename(apk), 'hash', got, 'want', want)
         if want is not None and got is not None and got != want:
             print('-> 버전이 달라서 안 써요')
             continue
         os.makedirs(os.path.dirname(out_path), exist_ok=True)
         open(out_path, 'wb').write(data)
         print('-> 공식 Rust 라이브러리 사용:', len(data), 'bytes')
         break
     else:
         print('공식 Rust 라이브러리를 못 찾았어요')
     PY
     rm -rf "$D"
     if [ -s "$P/arm64-v8a/librust_lib_violet.so" ]; then
       python3 -I - <<'PY'
     import sys

     p = 'rust_builder/cargokit/run_build_tool.sh'
     s = open(p, encoding='utf-8').read()
     BLOCK = r'''
     # [AI 추천 빌드] 공식 Rust 라이브러리가 있으면 그대로 복사하고 끝내요
     if [ "$1" = "build-gradle" ] && [ -n "${VIOLET_PREBUILT_RUST:-}" ] && [ -d "$VIOLET_PREBUILT_RUST" ]; then
       for p in $(echo "${CARGOKIT_TARGET_PLATFORMS:-android-arm64}" | tr ',' ' '); do
         case "$p" in
           android-arm64) abi=arm64-v8a ;;
           android-arm) abi=armeabi-v7a ;;
           android-x64) abi=x86_64 ;;
           android-x86) abi=x86 ;;
           *) abi="$p" ;;
         esac
         if ! ls "$VIOLET_PREBUILT_RUST/$abi/"*.so >/dev/null 2>&1; then
           echo "미리 받은 Rust 라이브러리가 없어요: $abi" >&2
           exit 1
         fi
         mkdir -p "$CARGOKIT_OUTPUT_DIR/$abi"
         cp "$VIOLET_PREBUILT_RUST/$abi/"*.so "$CARGOKIT_OUTPUT_DIR/$abi/"
         echo "공식 Rust 라이브러리 복사 완료: $abi"
       done
       exit 0
     fi
     '''
     if 'VIOLET_PREBUILT_RUST' in s:
         print(p, 'already patched')
         sys.exit(0)
     first, rest = s.split('\n', 1)
     if not first.startswith('#!'):
         sys.exit('unexpected run_build_tool.sh header')
     open(p, 'w', encoding='utf-8').write(first + '\n' + BLOCK + rest)
     print(p, 'patched')
     PY
       echo "dir=$P" >> "$GITHUB_OUTPUT"
     fi
