name: Build Violet Lite (AI 추천 + 번역)
on:
  push:
  workflow_dispatch:
concurrency:
  group: violet-build
  cancel-in-progress: true
jobs:
 build:
  runs-on: ubuntu-latest
  permissions:
   contents: write
  defaults:
   run:
    working-directory: violet
  steps:
  - uses: actions/checkout@v4
  - name: Check files
    id: chk
    run: |
     if [ -s ../mods/tr.txt ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "mods/tr.txt 가 아직 없어서 빌드는 건너뛰어요"; fi
  - name: Add taste recommend page
    if: steps.chk.outputs.ok == '1'
    run: |
     cat > lib/pages/bookmark/taste_recommend_page.dart <<'DART'
     import 'dart:math';
     import 'package:flutter/material.dart';
     import 'package:provider/provider.dart';
     import 'package:shared_preferences/shared_preferences.dart';
     import 'package:violet/algorithm/distance.dart';
     import 'package:violet/component/hitomi/hybrid_loader.dart';
     import 'package:violet/component/index.dart';
     import 'package:violet/component/query_translate.dart';
     import 'package:violet/database/database.dart';
     import 'package:violet/database/query.dart';
     import 'package:violet/database/user/bookmark.dart';
     import 'package:violet/database/user/record.dart';
     import 'package:violet/model/article_list_item.dart';
     import 'package:violet/settings/settings.dart';
     import 'package:violet/widgets/article_item/article_list_item_widget.dart';
     class TasteRecommendPage extends StatefulWidget {
     const TasteRecommendPage({super.key});
     @override
     State<TasteRecommendPage> createState() => _TasteRecommendPageState();
     }
     enum _Mode { taste, recent }
     class _Cand {
     _Cand(this.id, this.q, this.score, this.reason);
     final int id;
     final QueryResult q;
     final double score;
     final String reason;
     }
     class _Profile {
     final Map<String, double> weights = {};
     final Map<String, dynamic> vec = {};
     List<(String, ArtistType)> artists = [];
     final List<(String, ArtistType, double, String)> similar = [];
     final Map<int, _Cand> pool = {};
     List<(String, ArtistType)> simBases = [];
     int simBaseCursor = 0;
     int similarCursor = 0;
     final Set<String> similarNames = {};
     bool built = false;
     int sourceCount = 0;
     }
     class _TasteRecommendPageState extends State<TasteRecommendPage> {
     static const int _kResultCount = 20;
     static const int _kMinPages = 15;
     static const int _kRecentLimit = 30;
     static const int _kNetworkFetchLimit = 12;
     static const int _kChunkSize = 300;
     static const int _kKeepPerChunk = 25;
     static const int _kMaxArtistSourcePerDraw = 7;
     static const int _kMaxSimilarPerDraw = 10;
     static const int _kMaxPerArtist = 2;
     static const int _kSimilarPerArtist = 10; // 작가 페이지의 비슷한 작가 목록 앞쪽 10명
     static const int _kSimilarBases = 20;
     static const int _kSeenKeep = 3000;
     static const String _kSeenKey = 'ai_recommend_seen_ids';
     static const String _kSeenTitleKey = 'ai_recommend_seen_titles';
     final Random _rand = Random();
     _Mode _mode = _Mode.taste;
     final Map<_Mode, _Profile> _profiles = {
     _Mode.taste: _Profile(),
     _Mode.recent: _Profile(),
     };
     _Profile get _p => _profiles[_mode]!;
     bool _loading = true;
     final Set<_Mode> _fillingModes = {};
     bool get _filling => _fillingModes.contains(_mode);
     String _status = '';
     String? _message;
     String _drawInfo = '';
     final Set<int> _bookmarkedIds = {};
     final Set<int> _readIds = {};
     final List<int> _recentReadIds = [];
     final Set<int> _shownIds = {};
     final List<int> _seenOrder = [];
     final Set<String> _seenTitles = {};
     final List<String> _seenTitleOrder = [];
     final Set<String> _ownTitles = {};
     Map<int, QueryResult> _bookmarkMetas = {};
     Map<int, QueryResult> _readMetas = {};
     List<(String, ArtistType)> _favArtists = [];
     List<(String, int)> _anTags = [];
     List<(String, int)> _anArtists = [];
     List<(String, int)> _anLangs = [];
     int? _anPages;
     Set<String> _excluded = {};
     int _rollCount = 0;
     int? _minId;
     int? _maxId;
     List<_Cand> _results = [];
     bool get _hasDb => _minId != null && _maxId != null && _maxId! > _minId!;
     @override
     void initState() {
     super.initState();
     _init();
     }
     void _setStatus(String s) {
     if (mounted) setState(() => _status = s);
     }
     Future<void> _step(String status, Future<void> Function() job) async {
     if (!mounted) return;
     _setStatus(status);
     try {
     await job().timeout(const Duration(seconds: 20));
     } catch (_) {}
     }
     Future<void> _init() async {
     try {
     _setStatus('기록 불러오는 중...');
     await _loadSeen();
     await _loadIdRange();
     await _loadBase();
     } catch (e) {
     if (!mounted) return;
     setState(() {
     _loading = false;
     _message = '정보를 불러오지 못했어요.\n$e';
     });
     return;
     }
     await _enterMode(_Mode.taste);
     }
     String _norm(String s) => s
     .trim()
     .toLowerCase()
     .replaceAll(' ', '_')
     .replaceFirst(RegExp(r'^tag:'), '');
     String _tokenOf(String group, String name) {
     final n = _norm(name);
     if (n.isEmpty) return '';
     return (group == 'female' || group == 'male') ? '$group:$n' : n;
     }
     bool _isExcluded(String token) {
     if (_excluded.contains(token)) return true;
     final i = token.indexOf(':');
     return i >= 0 && _excluded.contains(token.substring(i + 1));
     }
     List<(String, String)> _tagsOf(QueryResult m) {
     try {
     return m.tagList();
     } catch (_) {
     return const [];
     }
     }
     bool _hasExcluded(QueryResult m) =>
     _tagsOf(m).any((t) => _isExcluded(_tokenOf(t.$1, t.$2)));
     int? _idOf(QueryResult q) => int.tryParse('${q.result['Id']}');
     bool _isNew(int id) =>
     !_bookmarkedIds.contains(id) &&
     !_readIds.contains(id) &&
     !_shownIds.contains(id);
     List<String> _splitNames(dynamic s) => '${s ?? ''}'
     .split('|')
     .map((e) => e.trim())
     .where((e) => e.isNotEmpty && e != 'n/a')
     .toList();
     String _mainArtist(QueryResult q) {
     final a = _splitNames(q.artists());
     if (a.isNotEmpty) return a.first;
     final g = _splitNames(q.groups());
     return g.isNotEmpty ? g.first : '';
     }
     String _lang() {
     final langs = HybridLoader.getSelectedLanguages();
     return langs.length == 1 ? langs.first : 'all';
     }
     Future<void> _loadSeen() async {
     try {
     final prefs = await SharedPreferences.getInstance();
     for (final s in prefs.getStringList(_kSeenKey) ?? const <String>[]) {
     final id = int.tryParse(s);
     if (id != null && _shownIds.add(id)) _seenOrder.add(id);
     }
     for (final t in prefs.getStringList(_kSeenTitleKey) ?? const <String>[]) {
     if (_seenTitles.add(t)) _seenTitleOrder.add(t);
     }
     } catch (_) {}
     }
     Future<void> _saveSeen() async {
     try {
     if (_seenOrder.length > _kSeenKeep) {
     _seenOrder.removeRange(0, _seenOrder.length - _kSeenKeep);
     }
     if (_seenTitleOrder.length > _kSeenKeep) {
     _seenTitleOrder.removeRange(0, _seenTitleOrder.length - _kSeenKeep);
     }
     final prefs = await SharedPreferences.getInstance();
     await prefs.setStringList(
     _kSeenKey,
     _seenOrder.map((e) => '$e').toList(),
     );
     await prefs.setStringList(_kSeenTitleKey, _seenTitleOrder);
     } catch (_) {}
     }
     Future<void> _loadIdRange() async {
     try {
     final db = await DataBaseManager.getInstance();
     final r = await db
     .query('SELECT MIN(Id) AS a, MAX(Id) AS b FROM HitomiColumnModel')
     .timeout(const Duration(seconds: 5));
     if (r.isNotEmpty) {
     _minId = int.tryParse('${r.first['a']}');
     _maxId = int.tryParse('${r.first['b']}');
     }
     } catch (_) {}
     }
     Future<void> _loadBase() async {
     _excluded = Settings.excludeTags.value
     .map(_norm)
     .where((e) => e.isNotEmpty)
     .toSet();
     final bookmark = await Bookmark.getInstance();
     for (final a in await bookmark.getArticle()) {
     final id = int.tryParse(a.article().trim());
     if (id != null) _bookmarkedIds.add(id);
     }
     try {
     final artists = await bookmark.getArtist();
     _favArtists = artists.map((a) => (a.artist(), a.type())).toList();
     } catch (_) {
     _favArtists = [];
     }
     try {
     final logs = await (await User.getInstance()).getUserLog();
     for (final log in logs) {
     final id = int.tryParse('${log.result['Article']}');
     if (id != null && _readIds.add(id)) _recentReadIds.add(id);
     }
     } catch (_) {}
     _setStatus('북마크 분석 중...');
     _bookmarkMetas = await _loadMetadata(
     _bookmarkedIds.toList(),
     maxNetwork: _kNetworkFetchLimit,
     );
     _readMetas = await _loadMetadata(
     _recentReadIds.take(2000).toList(),
     maxNetwork: 0,
     );
     for (final m in [..._bookmarkMetas.values, ..._readMetas.values]) {
     final k = _titleKey(m);
     if (k.isNotEmpty) _ownTitles.add(k);
     }
     }
     String _titleKey(QueryResult q) {
     final raw = '${q.result['Title'] ?? ''}'.toLowerCase();
     var t = raw.replaceAll(RegExp(r'\[[^\]]*\]|\([^)]*\)|\{[^}]*\}|【[^】]*】'), ' ');
     t = t.replaceAll(RegExp(r'[^\p{L}\p{N}]+', unicode: true), '');
     if (t.isEmpty) t = raw.replaceAll(RegExp(r'\s+'), '');
     return t.isEmpty ? '' : '${_mainArtist(q)}|$t';
     }
     int? _pages(QueryResult q) => int.tryParse('${q.result['Files'] ?? ''}');
     void _addTags(_Profile p, QueryResult m, double w) {
     final seen = <String>{};
     for (final (group, name) in _tagsOf(m)) {
     final token = _tokenOf(group, name);
     if (token.isEmpty || _isExcluded(token) || !seen.add(token)) continue;
     p.weights[token] = (p.weights[token] ?? 0) + w;
     }
     }
     void _buildVec(_Profile p) {
     p.vec.clear();
     p.weights.forEach((token, w) {
     final key = HentaiIndex.tagIndex[token.replaceAll('_', ' ')];
     if (key != null) p.vec[key.toString()] = w;
     });
     }
     Future<void> _buildTasteProfile(_Profile p) async {
     _setStatus('내 취향 분석 중...');
     final metas = _bookmarkMetas;
     p.sourceCount = metas.length;
     final tagCount = <String, int>{};
     final artistCount = <(String, ArtistType), int>{};
     final langCount = <String, int>{};
     final pages = <int>[];
     for (final m in metas.values) {
     _addTags(p, m, 1.0);
     final seen = <String>{};
     for (final (group, name) in _tagsOf(m)) {
     final token = _tokenOf(group, name);
     if (token.isEmpty || _isExcluded(token) || !seen.add(token)) continue;
     tagCount[token] = (tagCount[token] ?? 0) + 1;
     }
     for (final a in _splitNames(m.artists())) {
     final k = (a, ArtistType.artist);
     artistCount[k] = (artistCount[k] ?? 0) + 1;
     }
     for (final g in _splitNames(m.groups())) {
     final k = (g, ArtistType.group);
     artistCount[k] = (artistCount[k] ?? 0) + 1;
     }
     final lang = '${m.result['Language'] ?? ''}'.trim().toLowerCase();
     if (lang.isNotEmpty && lang != 'n/a') {
     langCount[lang] = (langCount[lang] ?? 0) + 1;
     }
     final pg = _pages(m);
     if (pg != null && pg > 0) pages.add(pg);
     }
     for (final raw in Settings.favoriteTags.value) {
     final token = _norm(raw);
     if (token.isEmpty || _isExcluded(token)) continue;
     p.weights[token] = (p.weights[token] ?? 0) + 3.0;
     }
     final total = max(1, metas.length);
     final tags = tagCount.entries.toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     _anTags = [
     for (final e in tags.take(8)) (e.key, (e.value * 100 / total).round()),
     ];
     final arts = artistCount.entries.where((e) => e.value >= 2).toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     _anArtists = [for (final e in arts.take(8)) (e.key.$1, e.value)];
     final langs = langCount.entries.toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     _anLangs = [
     for (final e in langs.take(3)) (e.key, (e.value * 100 / total).round()),
     ];
     pages.sort();
     _anPages = pages.isEmpty ? null : pages[pages.length ~/ 2];
     final favNames = _favArtists.map((e) => e.$1).toSet();
     final bmArtists = [
     for (final e in arts.take(15))
     if (!favNames.contains(e.key.$1)) e.key,
     ];
     p.artists = [..._favArtists, ...bmArtists];
     final favBases =
     _favArtists
     .where((e) => e.$2 == ArtistType.artist || e.$2 == ArtistType.group)
     .toList()
     ..shuffle(_rand);
     p.simBases = [...favBases, ...bmArtists].take(_kSimilarBases).toList();
     _buildVec(p);
     }
     Future<void> _buildRecentProfile(_Profile p) async {
     _setStatus('최근 본 작품 분석 중...');
     final recent = _recentReadIds.take(_kRecentLimit).toList();
     final metas = <int, QueryResult>{
     for (final id in recent)
     if (_readMetas[id] != null) id: _readMetas[id]!,
     };
     metas.addAll(
     await _loadMetadata(
     recent.where((e) => !metas.containsKey(e)).toList(),
     maxNetwork: _kNetworkFetchLimit,
     ),
     );
     p.sourceCount = metas.length;
     final artistW = <(String, ArtistType), double>{};
     for (var i = 0; i < recent.length; i++) {
     final m = metas[recent[i]];
     if (m == null) continue;
     final w = 1.0 / (1.0 + i / 8.0); // 최근에 본 것일수록 크게
     _addTags(p, m, w);
     for (final a in _splitNames(m.artists())) {
     final k = (a, ArtistType.artist);
     artistW[k] = (artistW[k] ?? 0) + w;
     }
     for (final g in _splitNames(m.groups())) {
     final k = (g, ArtistType.group);
     artistW[k] = (artistW[k] ?? 0) + w;
     }
     }
     final ranked = artistW.entries.toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     p.artists = ranked.take(10).map((e) => e.key).toList();
     p.simBases = List.of(p.artists);
     _buildVec(p);
     }
     double _score(_Profile p, QueryResult m) {
     final tags = _tagsOf(m);
     if (tags.isEmpty) return 0;
     var s = 0.0;
     for (final (group, name) in tags) {
     final w = p.weights[_tokenOf(group, name)];
     if (w != null) s += sqrt(w);
     }
     return s / sqrt(tags.length);
     }
     void _addCand(_Profile p, QueryResult q, double bonus, String reason) {
     final id = _idOf(q);
     if (id == null || !_isNew(id) || _hasExcluded(q)) return;
     final pages = _pages(q);
     if (pages != null && pages < _kMinPages) return;
     final tk = _titleKey(q);
     if (tk.isNotEmpty && (_ownTitles.contains(tk) || _seenTitles.contains(tk))) {
     return;
     }
     final score = _score(p, q) + bonus;
     final old = p.pool[id];
     if (old == null || score > old.score) {
     p.pool[id] = _Cand(id, q, score, reason);
     }
     }
     int _available(_Profile p) => p.pool.keys.where(_isNew).length;
     String _and(String sql, String cond) =>
     sql.contains('WHERE') ? '$sql AND $cond' : '$sql WHERE $cond';
     String _withFilters(String tokens) => _and(
     translate2query(
     '$tokens ${Settings.includeTags.value} ${Settings.serializedExcludeTags}'
     .trim(),
     ),
     '(Files IS NULL OR Files >= $_kMinPages)',
     );
     Future<List<QueryResult>> _localQuery(
     String tokens, {
     required int limit,
     required int maxPage,
     }) async {
     try {
     final sql = _withFilters(tokens);
     var page = maxPage <= 1 ? 0 : _rand.nextInt(maxPage);
     for (var i = 0; i < 3; i++) {
     final qm = QueryManager.queryPagination(sql, limit);
     qm.curPage = page;
     final list = await qm.next().timeout(const Duration(seconds: 10));
     if (list.isNotEmpty || page == 0) return list;
     page = page ~/ 4;
     }
     } catch (_) {}
     return [];
     }
     String _tagLabel(_Mode mode) =>
     mode == _Mode.taste ? '취향 태그' : '최근 본 작품과 비슷함';
     Future<void> _quickFill(_Profile p, _Mode mode, int chunks) async {
     if (!_hasDb || p.weights.isEmpty) return;
     final span = (_maxId! - _minId!).toDouble();
     for (var i = 0; i < chunks; i++) {
     final before = _maxId! + 1 - (span * pow(_rand.nextDouble(), 2)).toInt();
     final sql = _and(_withFilters(''), 'Id < $before');
     List<QueryResult> rows;
     try {
     rows = await QueryManager.queryPagination(
     sql,
     _kChunkSize,
     ).next().timeout(const Duration(seconds: 8));
     } catch (_) {
     continue;
     }
     final scored = <(QueryResult, double)>[];
     for (final q in rows) {
     final s = _score(p, q);
     if (s > 0) scored.add((q, s));
     }
     scored.sort((a, b) => b.$2.compareTo(a.$2));
     for (final (q, _) in scored.take(_kKeepPerChunk)) {
     _addCand(p, q, 0, _tagLabel(mode));
     }
     }
     }
     String? _pickToken(_Profile p) {
     final entries = p.weights.entries.toList();
     if (entries.isEmpty) return null;
     final ws = entries.map((e) => sqrt(e.value)).toList();
     var r = _rand.nextDouble() * ws.fold<double>(0, (a, b) => a + b);
     for (var i = 0; i < entries.length; i++) {
     r -= ws[i];
     if (r <= 0) return entries[i].key;
     }
     return entries.last.key;
     }
     Future<void> _fillTags(_Profile p, _Mode mode, int n) async {
     final tried = <String>{};
     for (var k = 0; k < n; k++) {
     final token = _pickToken(p);
     if (token == null) return;
     if (!tried.add(token)) continue;
     if (_hasDb) {
     for (final q in await _localQuery(token, limit: 30, maxPage: 15)) {
     _addCand(p, q, 0.5, '${_tagLabel(mode)}: $token');
     }
     } else {
     final ids = await _fetchIds(token);
     final fresh = ids.where(_isNew).toList()..shuffle(_rand);
     final metas = await _loadMetadata(
     fresh.take(12).toList(),
     maxNetwork: 12,
     );
     for (final q in metas.values) {
     _addCand(p, q, 0.5, '${_tagLabel(mode)}: $token');
     }
     }
     }
     }
     bool _safeName(String n) =>
     n.isNotEmpty &&
     !n.contains("'") &&
     !n.contains('"') &&
     !n.contains('(') &&
     !n.contains(')');
     String _orTokens(Iterable<(String, ArtistType)> list) =>
     '(${list.map((e) => '${e.$2.name}:${e.$1.replaceAll(' ', '_')}').join(' or ')})';
     String? _matchName(QueryResult q, Iterable<String> names) {
     final hay =
     '|${q.artists()}|${q.groups() ?? ''}|'
     '${q.result['Series'] ?? ''}|${q.result['Characters'] ?? ''}|'
     .toLowerCase();
     for (final n in names) {
     if (hay.contains('|${n.toLowerCase()}|')) return n;
     }
     return null;
     }
     Future<List<QueryResult>> _networkArtists(
     Iterable<(String, ArtistType)> list,
     ) async {
     final out = <QueryResult>[];
     for (final (name, type) in list) {
     try {
     final r = await HybridLoader.fetchArtistArticlesHybrid(
     name: name,
     type: type.name,
     language: _lang(),
     ).timeout(const Duration(seconds: 15));
     out.addAll((List<QueryResult>.of(r)..shuffle(_rand)).take(10));
     } catch (_) {}
     }
     return out;
     }
     Future<void> _fillArtists(_Profile p, _Mode mode) async {
     final list = p.artists.where((e) => _safeName(e.$1)).toList();
     if (mode == _Mode.taste) list.shuffle(_rand);
     if (list.isEmpty) return;
     final use = list.take(20).toList();
     final rows = _hasDb
     ? await _localQuery(_orTokens(use), limit: 60, maxPage: 5)
     : await _networkArtists(use.take(3));
     final names = use.map((e) => e.$1).toList();
     final favNames = _favArtists.map((e) => e.$1).toSet();
     for (final q in rows) {
     final who = _matchName(q, names);
     final String label;
     if (mode == _Mode.recent) {
     label = '최근 본 작가';
     } else if (who != null && !favNames.contains(who)) {
     label = '자주 북마크한 작가';
     } else {
     label = '즐겨찾는 작가';
     }
     _addCand(
     p,
     q,
     mode == _Mode.taste ? 3.0 : 2.0,
     who == null ? label : '$label: $who',
     );
     }
     }
     Future<void> _computeSimilarSome(_Profile p, int n) async {
     final own = {
     ...p.artists.map((e) => e.$1),
     ..._favArtists.map((e) => e.$1),
     };
     var done = 0;
     while (done < n && p.simBaseCursor < p.simBases.length) {
     final (name, type) = p.simBases[p.simBaseCursor++];
     done++;
     await Future<void>.delayed(Duration.zero);
     final isGroup = type == ArtistType.group;
     List<(String, double)> sims = [];
     try {
     sims = isGroup
     ? HentaiIndex.calculateSimilarGroups(name)
     : HentaiIndex.calculateSimilarArtists(name);
     } catch (_) {}
     for (final (other, baseSim) in sims.take(_kSimilarPerArtist)) {
     if (own.contains(other) ||
     !_safeName(other) ||
     !p.similarNames.add(other)) {
     continue;
     }
     p.similar.add((other, type, baseSim, name));
     }
     }
     }
     Future<void> _fillSimilar(_Profile p, _Mode mode) async {
     await _computeSimilarSome(p, 5);
     if (p.similar.isEmpty) return;
     final pick = <(String, ArtistType, double, String)>[];
     for (var i = 0; i < 12 && i < p.similar.length; i++) {
     pick.add(p.similar[p.similarCursor % p.similar.length]);
     p.similarCursor++;
     }
     final pairs = pick.map((e) => (e.$1, e.$2));
     final rows = _hasDb
     ? await _localQuery(_orTokens(pairs), limit: 150, maxPage: 3)
     : await _networkArtists(pairs.take(4));
     final names = pick.map((e) => e.$1).toList();
     final byArtist = <String, List<(QueryResult, double)>>{};
     for (final q in rows) {
     final who = _matchName(q, names);
     if (who == null) continue;
     byArtist.putIfAbsent(who, () => []).add((q, _score(p, q)));
     }
     for (final e in byArtist.entries) {
     final info = pick.firstWhere((x) => x.$1 == e.key);
     final list = e.value..sort((a, b) => b.$2.compareTo(a.$2));
     final good = list.where((x) => x.$2 > 0).take(4).toList();
     for (final (q, _) in good.isEmpty ? list.take(1) : good) {
     _addCand(
     p,
     q,
     2.5 + info.$3 / 100 * 2.0,
     '비슷한 작가: ${e.key} (${info.$4} 기준)',
     );
     }
     }
     }
     Future<void> _backgroundFill(_Mode mode) async {
     if (!_fillingModes.add(mode)) return;
     final p = _profiles[mode]!;
     if (mounted) setState(() {});
     try {
     await _fillSimilar(p, mode);
     await _fillArtists(p, mode);
     await _fillTags(p, mode, 3);
     await _quickFill(p, mode, 4);
     } catch (_) {
     } finally {
     _fillingModes.remove(mode);
     if (mounted) {
     if (_mode == mode && !_loading && _results.isEmpty) {
     _draw();
     } else {
     setState(() {});
     }
     }
     }
     }
     Future<Map<int, QueryResult>> _loadMetadata(
     List<int> ids, {
     required int maxNetwork,
     }) async {
     final out = <int, QueryResult>{};
     if (ids.isEmpty) return out;
     for (var i = 0; i < ids.length; i += 400) {
     try {
     final local = await QueryManager.queryIds(
     ids.sublist(i, min(i + 400, ids.length)),
     ).timeout(const Duration(seconds: 10));
     for (final q in local) {
     final id = _idOf(q);
     if (id != null) out[id] = q;
     }
     } catch (_) {}
     }
     var rest = ids.where((e) => !out.containsKey(e)).toList();
     for (var i = 0; i < rest.length; i += 400) {
     try {
     out.addAll(
     await HybridLoader.getCachedMetadataBatch(
     rest.sublist(i, min(i + 400, rest.length)),
     ).timeout(const Duration(seconds: 10)),
     );
     } catch (_) {}
     }
     rest = ids.where((e) => !out.containsKey(e)).take(maxNetwork).toList();
     for (var i = 0; i < rest.length; i += 6) {
     final chunk = rest.skip(i).take(6).toList();
     final fetched = await Future.wait(
     chunk.map((id) async {
     try {
     return await HybridLoader.idQueryHitomiFast(
     id,
     ).timeout(const Duration(seconds: 6));
     } catch (_) {
     return null;
     }
     }),
     );
     for (var j = 0; j < chunk.length; j++) {
     final q = fetched[j];
     if (q != null) out[chunk[j]] = q;
     }
     }
     return out;
     }
     Future<List<int>> _fetchIds(String token) async {
     var maxPage = 12;
     for (var i = 0; i < 3; i++) {
     final page = _rand.nextInt(maxPage);
     try {
     final ids = await HybridLoader.fetchGalleryIdsForQuery(
     query: token,
     page: page,
     pageSize: 30,
     targetLang: _lang(),
     ).timeout(const Duration(seconds: 15));
     if (ids.isNotEmpty) return ids;
     } catch (_) {}
     if (maxPage == 1) break;
     maxPage = max(1, maxPage ~/ 4);
     }
     return [];
     }
     Future<void> _enterMode(_Mode mode) async {
     setState(() {
     _mode = mode;
     _loading = true;
     _results = [];
     _message = null;
     _drawInfo = '';
     });
     final p = _profiles[mode]!;
     if (!p.built) {
     try {
     if (mode == _Mode.taste) {
     await _buildTasteProfile(p);
     } else {
     await _buildRecentProfile(p);
     }
     } catch (_) {}
     p.built = true;
     }
     if (!mounted || _mode != mode) return;
     if (p.weights.isEmpty && p.artists.isEmpty) {
     setState(() {
     _loading = false;
     _message = mode == _Mode.taste
     ? '북마크한 작품, 즐겨찾기 태그, 즐겨찾는 작가가 아직 없어요.\n'
     '마음에 드는 작품을 북마크하면 취향을 계산해서 추천해 드려요.'
     : '최근 본 작품이 아직 없어요.\n'
     '작품을 몇 개 보고 오면 비슷한 작품을 추천해 드려요.';
     });
     return;
     }
     if (_available(p) < _kResultCount) {
     await _step(
     '취향에 맞는 작품 찾는 중...',
     () => _hasDb ? _quickFill(p, mode, 3) : _fillTags(p, mode, 3),
     );
     await _step(
     mode == _Mode.taste ? '즐겨찾는 작가 작품 찾는 중...' : '최근 본 작가 작품 찾는 중...',
     () => _fillArtists(p, mode),
     );
     await _step('비슷한 작가 찾는 중...', () => _fillSimilar(p, mode));
     }
     if (!mounted || _mode != mode) return;
     _backgroundFill(mode);
     _draw();
     }
     void _draw() {
     final p = _p;
     final keyed =
     p.pool.values
     .where((c) => _isNew(c.id))
     .map(
     (c) => (
     c,
     pow(_rand.nextDouble(), 1 / max(0.05, c.score)).toDouble(),
     ),
     )
     .toList()
     ..sort((a, b) => b.$2.compareTo(a.$2));
     final picked = <_Cand>[];
     final pickedTitles = <String>{};
     final perArtist = <String, int>{};
     var art = 0;
     var sim = 0;
     for (final (c, _) in keyed) {
     if (picked.length >= _kResultCount) break;
     final isArt =
     c.reason.startsWith('즐겨찾는') ||
     c.reason.startsWith('자주 북마크한') ||
     c.reason.startsWith('최근 본 작가');
     final isSim = c.reason.startsWith('비슷한');
     if (isArt && art >= _kMaxArtistSourcePerDraw) continue;
     if (isSim && sim >= _kMaxSimilarPerDraw) continue;
     final who = _mainArtist(c.q);
     if (who.isNotEmpty && (perArtist[who] ?? 0) >= _kMaxPerArtist) continue;
     final tk = _titleKey(c.q);
     if (tk.isNotEmpty && !pickedTitles.add(tk)) continue;
     if (who.isNotEmpty) perArtist[who] = (perArtist[who] ?? 0) + 1;
     if (isArt) art++;
     if (isSim) sim++;
     picked.add(c);
     }
     for (final c in picked) {
     _shownIds.add(c.id);
     _seenOrder.add(c.id);
     p.pool.remove(c.id);
     }
     for (final t in pickedTitles) {
     if (_seenTitles.add(t)) _seenTitleOrder.add(t);
     }
     _saveSeen();
     _rollCount++;
     final artLabel = _mode == _Mode.taste ? '즐겨찾는 작가' : '최근 본 작가';
     setState(() {
     _loading = false;
     _status = '';
     _results = picked;
     _drawInfo =
     '이번 추천: ${_tagLabel(_mode)} ${picked.length - art - sim}개, '
     '$artLabel $art개, 비슷한 작가 $sim개';
     _message = picked.isEmpty
     ? (_filling
     ? '추천할 작품을 찾는 중이에요.\n잠시만 기다려 주세요.'
     : '추천할 작품을 찾지 못했어요.\n잠시 후 다시 뽑기를 눌러 보세요.')
     : null;
     });
     }
     Future<void> _reroll() async {
     final mode = _mode;
     final p = _p;
     if (_available(p) < _kResultCount) {
     setState(() {
     _loading = true;
     _results = [];
     });
     await _step(
     '작품 더 찾는 중...',
     () => _hasDb ? _quickFill(p, mode, 5) : _fillTags(p, mode, 2),
     );
     await _step('작가 작품 더 찾는 중...', () => _fillArtists(p, mode));
     await _step('비슷한 작가 작품 더 찾는 중...', () => _fillSimilar(p, mode));
     if (!mounted || _mode != mode) return;
     }
     if (_available(p) < 70) _backgroundFill(mode);
     _draw();
     }
     String _langKo(String lang) =>
     const {
     'korean': '한국어',
     'japanese': '일본어',
     'english': '영어',
     'chinese': '중국어',
     'spanish': '스페인어',
     'russian': '러시아어',
     }[lang] ??
     lang;
     List<String> _topTokens(_Profile p, int n) {
     final entries = p.weights.entries.toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     return entries.take(n).map((e) => e.key).toList();
     }
     @override
     Widget build(BuildContext context) {
     return Scaffold(
     appBar: AppBar(title: const Text('AI 추천')),
     floatingActionButton: FloatingActionButton.extended(
     heroTag: 'ai-recommend-fab',
     onPressed: _loading ? null : _reroll,
     icon: const Icon(Icons.casino_outlined),
     label: const Text('다시 뽑기'),
     backgroundColor: Settings.majorColor.value,
     foregroundColor: Colors.white,
     ),
     body: Column(
     children: [
     Padding(
     padding: const EdgeInsets.fromLTRB(12, 8, 12, 0),
     child: Row(
     children: [
     _modeChip('내 취향', _Mode.taste),
     const SizedBox(width: 8),
     _modeChip('최근 본 작품', _Mode.recent),
     ],
     ),
     ),
     Expanded(child: _buildBody(context)),
     ],
     ),
     );
     }
     Widget _modeChip(String label, _Mode mode) {
     return ChoiceChip(
     label: Text(label),
     selected: _mode == mode,
     onSelected: (v) {
     if (v && _mode != mode) _enterMode(mode);
     },
     );
     }
     Widget _buildBody(BuildContext context) {
     if (_loading && _results.isEmpty) {
     return Center(
     child: Column(
     mainAxisSize: MainAxisSize.min,
     children: [
     const CircularProgressIndicator(),
     const SizedBox(height: 16),
     Text(_status, textAlign: TextAlign.center),
     ],
     ),
     );
     }
     if (_message != null) {
     return Center(
     child: Padding(
     padding: const EdgeInsets.all(24),
     child: Column(
     mainAxisSize: MainAxisSize.min,
     children: [
     if (_filling) ...[
     const CircularProgressIndicator(),
     const SizedBox(height: 16),
     ],
     Text(_message!, textAlign: TextAlign.center),
     ],
     ),
     ),
     );
     }
     return ListView.builder(
     key: ValueKey('ai_list_${_mode.name}_$_rollCount'),
     padding: const EdgeInsets.only(bottom: 96),
     itemCount: _results.length + 1,
     itemBuilder: (context, index) {
     if (index == 0) return _header(context);
     return _item(context, index - 1);
     },
     );
     }
     Widget _header(BuildContext context) {
     final p = _p;
     final hint = TextStyle(color: Theme.of(context).hintColor, fontSize: 13);
     final favTagCount = Settings.favoriteTags.value
     .where((e) => e.trim().isNotEmpty)
     .length;
     final summary = _mode == _Mode.taste
     ? '북마크 ${p.sourceCount}개, 즐겨찾기 태그 $favTagCount개, '
     '즐겨찾는 작가 ${_favArtists.length}명으로 취향을 계산했어요.'
     : '최근 본 작품 ${p.sourceCount}개로 요즘 취향을 계산했어요.';
     return Padding(
     padding: const EdgeInsets.fromLTRB(16, 8, 16, 8),
     child: Column(
     crossAxisAlignment: CrossAxisAlignment.start,
     children: [
     if (_filling) ...[
     const LinearProgressIndicator(),
     const SizedBox(height: 6),
     Text('다음 추천에 쓸 작품을 미리 모으는 중...', style: hint),
     ],
     const SizedBox(height: 6),
     if (_mode == _Mode.taste) ...[
     Text(
     '내 취향 분석',
     style: hint.copyWith(fontWeight: FontWeight.w700),
     ),
     const SizedBox(height: 4),
     Text(
     '· 북마크 ${p.sourceCount}개, 즐겨찾기 태그 $favTagCount개, '
     '즐겨찾는 작가 ${_favArtists.length}명을 분석했어요.',
     style: hint,
     ),
     if (_anTags.isNotEmpty)
     Text(
     '· 좋아하는 태그: '
     '${_anTags.take(6).map((e) => '${e.$1} ${e.$2}%').join(', ')}',
     style: hint,
     ),
     if (_anArtists.isNotEmpty)
     Text(
     '· 자주 북마크한 작가: '
     '${_anArtists.take(5).map((e) => '${e.$1}(${e.$2})').join(', ')}',
     style: hint,
     ),
     if (_anLangs.isNotEmpty)
     Text(
     '· 주로 보는 언어: '
     '${_anLangs.map((e) => '${_langKo(e.$1)} ${e.$2}%').join(', ')}',
     style: hint,
     ),
     if (_anPages != null)
     Text('· 보통 $_anPages쪽 정도 되는 작품을 봐요.', style: hint),
     ] else ...[
     Text(summary, style: hint),
     const SizedBox(height: 4),
     Text('자주 나온 태그: ${_topTokens(p, 8).join(', ')}', style: hint),
     ],
     if (p.similar.isNotEmpty) ...[
     const SizedBox(height: 4),
     Text(
     '· 비슷한 작가 목록에서 찾는 작가: '
     '${p.similar.take(5).map((e) => e.$1).join(', ')}'
     '${p.similar.length > 5 ? ' 외 ${p.similar.length - 5}명' : ''}',
     style: hint,
     ),
     ],
     if (_mode == _Mode.taste && _favArtists.isEmpty) ...[
     const SizedBox(height: 4),
     Text(
     '작가 페이지에서 하트를 눌러 작가를 즐겨찾기하면, '
     '그 작가와 비슷한 작가 작품도 추천돼요.',
     style: hint,
     ),
     ],
     if (_drawInfo.isNotEmpty) ...[
     const SizedBox(height: 4),
     Text(_drawInfo, style: hint),
     ],
     ],
     ),
     );
     }
     Widget _item(BuildContext context, int index) {
     final c = _results[index];
     return KeyedSubtree(
     key: ValueKey('ai_${_mode.name}_${_rollCount}_${c.id}'),
     child: Column(
     crossAxisAlignment: CrossAxisAlignment.start,
     children: [
     Padding(
     padding: const EdgeInsets.fromLTRB(14, 6, 14, 0),
     child: Text(
     c.reason,
     style: TextStyle(color: Theme.of(context).hintColor, fontSize: 12),
     ),
     ),
     Provider<ArticleListItem>.value(
     value: ArticleListItem.fromArticleListItem(
     queryResult: c.q,
     showDetail: true,
     addBottomPadding: true,
     width: MediaQuery.of(context).size.width - 4.0,
     thumbnailTag: 'ai_${_mode.name}_${_rollCount}_$index',
     usableTabList: _results.map((e) => e.q).toList(),
     ),
     child: const ArticleListItemWidget(),
     ),
     ],
     ),
     );
     }
     }
