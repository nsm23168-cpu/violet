name: Build Violet Lite (AI 추천 + 번역)
on:
  push:
  workflow_dispatch:
concurrency:
  group: violet-build
  cancel-in-progress: true
jobs:
 build:
  runs-on: ubuntu-latest
  permissions:
   contents: write
  defaults:
   run:
    working-directory: up/violet
  steps:
  - uses: actions/checkout@v4
    with:
     sparse-checkout: mods
  - name: Check files
    id: chk
    working-directory: ${{ github.workspace }}
    run: |
     if [ -s mods/tr.txt ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "mods/tr.txt 가 아직 없어서 빌드는 건너뛰어요"; fi
  - name: Get latest Violet Lite source
    id: src
    if: steps.chk.outputs.ok == '1'
    working-directory: ${{ github.workspace }}
    run: |
     REPO=https://github.com/hanyuec8/violet-lite
     TAG=$(git ls-remote --tags --refs "$REPO" | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-lite$' | sort -V | tail -n 1 || true)
     rm -rf up
     if [ -n "$TAG" ]; then
       git clone --depth 1 --branch "$TAG" "$REPO" up
     else
       TAG=dev
       git clone --depth 1 "$REPO" up
     fi
     FV=$(grep -m1 -E '^\s+flutter:\s*"?[0-9]+\.[0-9]+\.[0-9]+' up/violet/pubspec.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
     echo "원본 버전: $TAG / Flutter ${FV:-3.35.4}"
     echo "tag=$TAG" >> "$GITHUB_OUTPUT"
     echo "flutter=${FV:-3.35.4}" >> "$GITHUB_OUTPUT"
  - name: Add taste recommend page
    if: steps.chk.outputs.ok == '1'
    run: |
     cat > lib/pages/bookmark/taste_recommend_page.dart <<'DART'
     import 'dart:convert';
     import 'dart:math';
     import 'package:flutter/material.dart';
     import 'package:provider/provider.dart';
     import 'package:shared_preferences/shared_preferences.dart';
     import 'package:violet/algorithm/distance.dart';
     import 'package:violet/component/hitomi/first_page_grouper.dart';
     import 'package:violet/component/hitomi/hybrid_loader.dart';
     import 'package:violet/component/hitomi/population.dart';
     import 'package:violet/component/index.dart';
     import 'package:violet/component/query_translate.dart';
     import 'package:violet/database/database.dart';
     import 'package:violet/database/query.dart';
     import 'package:violet/database/user/bookmark.dart';
     import 'package:violet/database/user/record.dart';
     import 'package:violet/model/article_list_item.dart';
     import 'package:violet/pages/common/utils.dart';
     import 'package:violet/settings/settings.dart';
     import 'package:violet/widgets/article_item/article_list_item_widget.dart';
     class TasteRecommendPage extends StatefulWidget {
     const TasteRecommendPage({super.key});
     @override
     State<TasteRecommendPage> createState() => _TasteRecommendPageState();
     }
     enum _Mode { taste, recent }
     enum _Src { ai, tag, artist, similar, related }
     class _Cand {
     _Cand(this.id, this.q, this.bonus, this.reason, this.src);
     final int id;
     final QueryResult q;
     final double bonus;
     final String reason;
     final _Src src;
     String label = '';
     bool explore = false;
     }
     class _Sample {
     _Sample(this.f, this.y, this.w);
     final List<String> f;
     final double y;
     final double w;
     }
     class _TasteModel {
     final Map<String, double> w = {};
     final Map<String, double> prior = {};
     final Map<String, int> support = {};
     double b = 0;
     bool trained = false;
     double value(String k) => w[k] ?? prior[k] ?? 0.0;
     static double sig(double z) => 1 / (1 + exp(-z));
     double logit(List<String> f) {
     if (f.isEmpty) return b;
     final x = 1 / sqrt(f.length);
     var z = b;
     for (final k in f) {
     z += value(k) * x;
     }
     return z;
     }
     void _step(List<String> f, double y, double sw, double lr, double l2) {
     if (f.isEmpty) return;
     final x = 1 / sqrt(f.length);
     final g = (sig(logit(f)) - y) * sw;
     b -= lr * g * 0.2;
     for (final k in f) {
     final cur = value(k);
     final pr = prior[k] ?? 0.0;
     w[k] = cur - lr * (g * x + l2 * (cur - pr));
     }
     }
     Future<void> train(List<_Sample> data, Random rand) async {
     support.clear();
     for (final s in data) {
     for (final k in s.f) {
     support[k] = (support[k] ?? 0) + 1;
     }
     }
     final order = List<int>.generate(data.length, (i) => i);
     for (var e = 0; e < 8; e++) {
     order.shuffle(rand);
     final lr = 0.7 / (1 + e * 0.3);
     for (final i in order) {
     final s = data[i];
     _step(s.f, s.y, s.w, lr, 0.0005);
     }
     await Future<void>.delayed(Duration.zero);
     }
     trained = true;
     }
     void learn(List<String> f, double y) {
     if (f.isEmpty) return;
     final x = 1 / sqrt(f.length);
     final like = y > 0.5;
     for (var i = 0; i < (like ? 4 : 3); i++) {
     final g = (sig(logit(f)) - y) * (like ? 2.5 : 2.0);
     for (final k in f) {
     final cur = value(k);
     final damp = 1 / (1 + (like ? max(0.0, -cur) : max(0.0, cur)));
     w[k] = cur - 0.4 * g * x * damp;
     }
     }
     for (final k in f) {
     support[k] = (support[k] ?? 0) + 1;
     }
     }
     }
     class _Profile {
     final _TasteModel model = _TasteModel();
     final Map<String, double> weights = {};
     final Map<String, dynamic> vec = {};
     List<(String, ArtistType)> artists = [];
     final List<(String, ArtistType, double, String)> similar = [];
     final Map<int, _Cand> pool = {};
     List<(String, ArtistType)> simBases = [];
     int simBaseCursor = 0;
     final Set<String> usedSimilar = {};
     final Set<String> similarNames = {};
     final Set<int> usedSeeds = {};
     bool built = false;
     int sourceCount = 0;
     int posCount = 0;
     int negCount = 0;
     }
     class _TasteRecommendPageState extends State<TasteRecommendPage> {
     static const int _kResultCount = 20;
     static const int _kMinPages = 15;
     static const int _kRecentLimit = 30;
     static const int _kNetworkFetchLimit = 12;
     static const int _kChunkSize = 300;
     static const int _kKeepPerChunk = 25;
     static const int _kMaxArtistSourcePerDraw = 7;
     static const int _kMaxSimilarPerDraw = 10;
     static const int _kMaxRelatedPerDraw = 6;
     static const int _kExploreSlots = 2;
     static const int _kMaxPerArtist = 2;
     static const int _kSimilarPerArtist = 10; // 작가 페이지의 비슷한 작가 목록 앞쪽 10명
     static const int _kSimilarBases = 20;
     static const int _kSeenKeep = 3000;
     static const int _kTasteTokens = 80;
     static const double _kMinMatch = 0.2; // 비슷한 작가가 내 취향과 이만큼은 맞아야 해요
     static const double _kMinLogit = -1.0; // AI 점수가 이보다 낮으면 웬만하면 안 보여줘요
     static const double _kTemp = 0.8; // 낮을수록 점수 높은 작품 위주, 높을수록 다양하게
     static const double _kMaxOverlap = 0.7; // 태그가 이만큼 겹치면 같은 페이지에 안 넣어요
     static const String _kSeenKey = 'ai_recommend_seen_ids';
     static const String _kSeenTitleKey = 'ai_recommend_seen_titles';
     static const String _kSimCacheKey = 'ai_similar_cache_v2';
     static const String _kPageCacheKey = 'ai_page_cache_v1';
     static const String _kFeedbackKey = 'ai_feedback_v1';
     final Random _rand = Random();
     _Mode _mode = _Mode.taste;
     final Map<_Mode, _Profile> _profiles = {
     _Mode.taste: _Profile(),
     _Mode.recent: _Profile(),
     };
     _Profile get _p => _profiles[_mode]!;
     bool _loading = true;
     final Set<_Mode> _fillingModes = {};
     bool get _filling => _fillingModes.contains(_mode);
     String _status = '';
     String? _message;
     String _drawInfo = '';
     bool _showAnalysis = true;
     bool _drawing = false;
     bool _prefetching = false;
     final Set<int> _bookmarkedIds = {};
     final Set<int> _readIds = {};
     final List<int> _recentReadIds = [];
     final Map<int, int> _readMaxPage = {};
     final Map<int, int> _readSessions = {};
     final Set<int> _shownIds = {};
     final List<int> _seenOrder = [];
     final List<int> _prevShown = [];
     final Set<String> _seenTitles = {};
     final List<String> _seenTitleOrder = [];
     final Set<String> _ownTitles = {};
     final Map<int, int> _feedback = {};
     final Map<int, QueryResult> _fbMetas = {};
     Map<int, QueryResult> _bookmarkMetas = {};
     Map<int, QueryResult> _readMetas = {};
     Map<int, QueryResult> _shownMetas = {};
     List<QueryResult> _background = [];
     final Map<int, int> _pageCache = {};
     final Map<int, List<String>> _featCache = {};
     final Map<String, String> _strs = {};
     final Map<String, List<(String, double)>> _simCache = {};
     final Map<String, String> _idxToToken = {};
     double _maxTagCount = 0;
     int _engagedCount = 0;
     int _bouncedCount = 0;
     List<(String, ArtistType)> _favArtists = [];
     List<(String, int)> _anTags = [];
     List<String> _anFavTags = [];
     List<(String, int)> _anArtists = [];
     List<(String, int)> _anLangs = [];
     int? _anPages;
     Set<String> _excluded = {};
     int _rollCount = 0;
     int? _minId;
     int? _maxId;
     List<_Cand> _results = [];
     bool get _hasDb => _minId != null && _maxId != null && _maxId! > _minId!;
     @override
     void initState() {
     super.initState();
     _init();
     }
     void _setStatus(String s) {
     if (mounted) setState(() => _status = s);
     }
     Future<void> _step(String status, Future<void> Function() job) async {
     if (!mounted) return;
     _setStatus(status);
     try {
     await job().timeout(const Duration(seconds: 20));
     } catch (_) {}
     }
     Future<void> _init() async {
     try {
     _setStatus('기록 불러오는 중...');
     await Future.wait([
     _loadSeen(),
     _loadCaches(),
     _loadFeedback(),
     _loadIdRange(),
     _loadTagStats(),
     _loadPopulation(),
     ]);
     await _loadBase();
     } catch (e) {
     if (!mounted) return;
     setState(() {
     _loading = false;
     _message = '정보를 불러오지 못했어요.\n$e';
     });
     return;
     }
     await _enterMode(_Mode.taste);
     }
     String _norm(String s) => s
     .trim()
     .toLowerCase()
     .replaceAll(' ', '_')
     .replaceFirst(RegExp(r'^tag:'), '');
     String _tokenOf(String group, String name) {
     final n = _norm(name);
     if (n.isEmpty) return '';
     return (group == 'female' || group == 'male') ? '$group:$n' : n;
     }
     bool _isExcluded(String token) {
     if (_excluded.contains(token)) return true;
     final i = token.indexOf(':');
     return i >= 0 && _excluded.contains(token.substring(i + 1));
     }
     List<(String, String)> _tagsOf(QueryResult m) {
     try {
     return m.tagList();
     } catch (_) {
     return const [];
     }
     }
     bool _hasExcluded(QueryResult m) =>
     _tagsOf(m).any((t) => _isExcluded(_tokenOf(t.$1, t.$2)));
     int? _idOf(QueryResult q) => int.tryParse('${q.result['Id']}');
     bool _isNew(int id) =>
     !_bookmarkedIds.contains(id) &&
     !_readIds.contains(id) &&
     !_shownIds.contains(id);
     List<String> _splitNames(dynamic s) => '${s ?? ''}'
     .split('|')
     .map((e) => e.trim())
     .where((e) => e.isNotEmpty && e != 'n/a' && e != 'null')
     .toList();
     String _mainArtist(QueryResult q) {
     final a = _splitNames(q.artists());
     if (a.isNotEmpty) return a.first;
     final g = _splitNames(q.groups());
     return g.isNotEmpty ? g.first : '';
     }
     String _lang() {
     final langs = HybridLoader.getSelectedLanguages();
     return langs.length == 1 ? langs.first : 'all';
     }
     Future<void> _loadPopulation() async {
     try {
     await Population.ensureLoaded().timeout(const Duration(seconds: 8));
     } catch (_) {}
     }
     Future<void> _loadSeen() async {
     try {
     final prefs = await SharedPreferences.getInstance();
     for (final s in prefs.getStringList(_kSeenKey) ?? const <String>[]) {
     final id = int.tryParse(s);
     if (id != null && _shownIds.add(id)) _seenOrder.add(id);
     }
     for (final t in prefs.getStringList(_kSeenTitleKey) ?? const <String>[]) {
     if (_seenTitles.add(t)) _seenTitleOrder.add(t);
     }
     final n = _seenOrder.length;
     _prevShown.addAll(_seenOrder.sublist(n > 500 ? n - 500 : 0));
     } catch (_) {}
     }
     Future<void> _loadCaches() async {
     try {
     final prefs = await SharedPreferences.getInstance();
     final raw = prefs.getString(_kSimCacheKey);
     if (raw != null) {
     final m = jsonDecode(raw) as Map<String, dynamic>;
     m.forEach((base, list) {
     _simCache[base] = [
     for (final e in list as List)
     ('${(e as List)[0]}', (e[1] as num).toDouble()),
     ];
     });
     }
     for (final s in prefs.getStringList(_kPageCacheKey) ?? const <String>[]) {
     final i = s.indexOf(':');
     if (i <= 0) continue;
     final id = int.tryParse(s.substring(0, i));
     final pg = int.tryParse(s.substring(i + 1));
     if (id != null && pg != null) _pageCache[id] = pg;
     }
     } catch (_) {}
     }
     Future<void> _saveCaches() async {
     try {
     final prefs = await SharedPreferences.getInstance();
     final sim = <String, dynamic>{
     for (final e in _simCache.entries)
     e.key: [
     for (final (n, v) in e.value) [n, v],
     ],
     };
     await prefs.setString(_kSimCacheKey, jsonEncode(sim));
     final pages = _pageCache.entries.where((e) => e.value > 0).toList();
     final keep = pages.length > 6000
     ? pages.sublist(pages.length - 6000)
     : pages;
     await prefs.setStringList(_kPageCacheKey, [
     for (final e in keep) '${e.key}:${e.value}',
     ]);
     } catch (_) {}
     }
     Future<void> _loadFeedback() async {
     try {
     final prefs = await SharedPreferences.getInstance();
     for (final s in prefs.getStringList(_kFeedbackKey) ?? const <String>[]) {
     final i = s.indexOf(':');
     if (i <= 0) continue;
     final id = int.tryParse(s.substring(0, i));
     final v = int.tryParse(s.substring(i + 1));
     if (id == null || v == null || v == 0) continue;
     _feedback.remove(id);
     _feedback[id] = v > 0 ? 1 : -1;
     }
     } catch (_) {}
     }
     Future<void> _saveFeedback() async {
     try {
     final entries = _feedback.entries.toList();
     final keep = entries.length > 2000
     ? entries.sublist(entries.length - 2000)
     : entries;
     final prefs = await SharedPreferences.getInstance();
     await prefs.setStringList(_kFeedbackKey, [
     for (final e in keep) '${e.key}:${e.value}',
     ]);
     } catch (_) {}
     }
     Future<void> _loadTagStats() async {
     try {
     await HentaiIndex.loadCountMapIfRequired().timeout(
     const Duration(seconds: 10),
     );
     } catch (_) {}
     final tc = HentaiIndex.tagCount;
     if (tc != null) {
     for (final g in ['female', 'male', 'tag']) {
     final m = tc[g];
     if (m is Map) {
     for (final v in m.values) {
     if (v is num && v > _maxTagCount) _maxTagCount = v.toDouble();
     }
     }
     }
     }
     HentaiIndex.tagIndex.forEach((tag, idx) {
     _idxToToken['$idx'] = _norm(tag);
     });
     }
     double _idf(String token) {
     if (_maxTagCount <= 0) return 1.0;
     final tc = HentaiIndex.tagCount;
     final i = token.indexOf(':');
     final group = i >= 0 ? token.substring(0, i) : 'tag';
     final name = (i >= 0 ? token.substring(i + 1) : token).replaceAll('_', ' ');
     final m = tc?[group];
     final c = (m is Map && m[name] is num) ? (m[name] as num).toDouble() : 0.0;
     return log(1 + _maxTagCount / (1 + c));
     }
     Map<String, double> _artistShare(String name, ArtistType type) {
     final v = (type == ArtistType.group
     ? HentaiIndex.tagGroup
     : HentaiIndex.tagArtist)[name];
     if (v is! Map) return const {};
     var top = 0.0;
     v.forEach((k, c) {
     if (c is num && c > top) top = c.toDouble();
     });
     if (top <= 0) return const {};
     final out = <String, double>{};
     v.forEach((k, c) {
     final tok = _idxToToken['$k'];
     if (tok != null && c is num && !_isExcluded(tok)) out[tok] = c / top;
     });
     return out;
     }
     void _finishWeights(_Profile p, Map<String, double> raw) {
     final scored = <(String, double)>[
     for (final e in raw.entries)
     if (e.value > 0) (e.key, e.value * _idf(e.key)),
     ]..sort((a, b) => b.$2.compareTo(a.$2));
     p.weights.clear();
     final top = scored.isEmpty ? 1.0 : scored.first.$2;
     for (final (t, w) in scored.take(_kTasteTokens)) {
     p.weights[t] = w / top;
     }
     }
     Future<void> _saveSeen() async {
     try {
     if (_seenOrder.length > _kSeenKeep) {
     _seenOrder.removeRange(0, _seenOrder.length - _kSeenKeep);
     }
     if (_seenTitleOrder.length > _kSeenKeep) {
     _seenTitleOrder.removeRange(0, _seenTitleOrder.length - _kSeenKeep);
     }
     final prefs = await SharedPreferences.getInstance();
     await prefs.setStringList(
     _kSeenKey,
     _seenOrder.map((e) => '$e').toList(),
     );
     await prefs.setStringList(_kSeenTitleKey, _seenTitleOrder);
     } catch (_) {}
     }
     Future<void> _loadIdRange() async {
     try {
     final db = await DataBaseManager.getInstance();
     final r = await db
     .query('SELECT MIN(Id) AS a, MAX(Id) AS b FROM HitomiColumnModel')
     .timeout(const Duration(seconds: 5));
     if (r.isNotEmpty) {
     _minId = int.tryParse('${r.first['a']}');
     _maxId = int.tryParse('${r.first['b']}');
     }
     } catch (_) {}
     }
     Future<void> _loadBase() async {
     _excluded = Settings.excludeTags.value
     .map(_norm)
     .where((e) => e.isNotEmpty)
     .toSet();
     final bookmark = await Bookmark.getInstance();
     for (final a in await bookmark.getArticle()) {
     final id = int.tryParse(a.article().trim());
     if (id != null) _bookmarkedIds.add(id);
     }
     try {
     final artists = await bookmark.getArtist();
     _favArtists = artists.map((a) => (a.artist(), a.type())).toList();
     } catch (_) {
     _favArtists = [];
     }
     try {
     final logs = await (await User.getInstance()).getUserLog();
     for (final entry in logs) {
     final id = int.tryParse('${entry.result['Article']}');
     if (id == null) continue;
     if (_readIds.add(id)) _recentReadIds.add(id);
     _readSessions[id] = (_readSessions[id] ?? 0) + 1;
     final lp = int.tryParse('${entry.result['LastPage'] ?? ''}');
     if (lp != null && lp > (_readMaxPage[id] ?? -1)) _readMaxPage[id] = lp;
     }
     } catch (_) {}
     _setStatus('북마크와 읽은 기록 분석 중...');
     final metas = await Future.wait([
     _loadMetadata(_bookmarkedIds.toList(), maxNetwork: _kNetworkFetchLimit),
     _loadMetadata(_recentReadIds.take(2000).toList(), maxNetwork: 0),
     _loadMetadata(_feedback.keys.toList(), maxNetwork: 30),
     _loadMetadata(
     _prevShown
     .where((e) => !_readIds.contains(e) && !_feedback.containsKey(e))
     .toList(),
     maxNetwork: 0,
     ),
     ]);
     _bookmarkMetas = metas[0];
     _readMetas = metas[1];
     _fbMetas.addAll(metas[2]);
     _shownMetas = metas[3];
     for (final m in [..._bookmarkMetas.values, ..._readMetas.values]) {
     final k = _titleKey(m);
     if (k.isNotEmpty) _ownTitles.add(k);
     }
     for (final id in _recentReadIds) {
     final e = _engagement(id);
     if (e > 0) _engagedCount++;
     if (e < 0) _bouncedCount++;
     }
     _setStatus('비교할 작품 고르는 중...');
     await _loadBackground();
     }
     Future<void> _loadBackground() async {
     if (!_hasDb) return;
     final span = (_maxId! - _minId!).toDouble();
     final out = <int, QueryResult>{};
     for (var i = 0; i < 3; i++) {
     final before = _maxId! + 1 - (span * pow(_rand.nextDouble(), 2)).toInt();
     try {
     final rows = await QueryManager.queryPagination(
     _and(_withFilters(''), 'Id < $before'),
     300,
     ).next().timeout(const Duration(seconds: 8));
     for (final q in rows) {
     final id = _idOf(q);
     if (id == null ||
     _bookmarkedIds.contains(id) ||
     _readIds.contains(id)) {
     continue;
     }
     out[id] = q;
     }
     } catch (_) {}
     }
     _background = out.values.toList();
     }
     int _engagement(int id) {
     final lp = _readMaxPage[id];
     if (lp == null) return 0;
     final q = _readMetas[id];
     final pages = q == null ? null : _knownPagesOf(id, q);
     if (pages != null) {
     if (lp + 1 >= pages * 0.7) return 1;
     if (lp + 1 <= max(3, pages * 0.2)) return -1;
     return 0;
     }
     if (lp >= 20) return 1;
     if (lp <= 2) return -1;
     return 0;
     }
     int? _knownPagesOf(int id, QueryResult q) {
     final pg = _pages(q) ?? 0;
     if (pg > 0) return pg;
     final c = _pageCache[id];
     return (c != null && c > 0) ? c : null;
     }
     String _titleKey(QueryResult q) {
     final raw = '${q.result['Title'] ?? ''}'.toLowerCase();
     var t = raw.replaceAll(
     RegExp(r'\[[^\]]*\]|\([^)]*\)|\{[^}]*\}|【[^】]*】'),
     ' ',
     );
     t = t.replaceAll(RegExp(r'[^\p{L}\p{N}]+', unicode: true), '');
     if (t.isEmpty) t = raw.replaceAll(RegExp(r'\s+'), '');
     return t.isEmpty ? '' : '${_mainArtist(q)}|$t';
     }
     String _shortTitle(QueryResult q) {
     final raw = '${q.result['Title'] ?? ''}'.trim();
     var t = raw
     .replaceAll(RegExp(r'\[[^\]]*\]|\([^)]*\)|\{[^}]*\}'), ' ')
     .replaceAll(RegExp(r'\s+'), ' ')
     .trim();
     if (t.isEmpty) t = raw;
     return t.length > 16 ? '${t.substring(0, 16)}…' : t;
     }
     int? _pages(QueryResult q) => int.tryParse('${q.result['Files'] ?? ''}');
     List<String> _feats(QueryResult q) {
     final out = <String>{};
     for (final (group, name) in _tagsOf(q)) {
     final t = _tokenOf(group, name);
     if (t.isNotEmpty) out.add('t:$t');
     }
     for (final a in _splitNames(q.artists())) {
     out.add('a:${a.toLowerCase()}');
     }
     for (final g in _splitNames(q.groups())) {
     out.add('g:${g.toLowerCase()}');
     }
     for (final s in _splitNames(q.series())) {
     final n = s.toLowerCase();
     if (n != 'original') out.add('s:$n');
     }
     for (final c in _splitNames(q.characters())) {
     out.add('c:${c.toLowerCase()}');
     }
     final type = '${q.result['Type'] ?? ''}'.trim().toLowerCase();
     if (type.isNotEmpty && type != 'null') out.add('y:$type');
     return [for (final f in out) _strs.putIfAbsent(f, () => f)];
     }
     List<String> _featsOf(int id, QueryResult q) =>
     _featCache.putIfAbsent(id, () => _feats(q));
     Set<String> _tagSet(_Cand c) =>
     _featsOf(c.id, c.q).where((f) => f.startsWith('t:')).toSet();
     String? _artistKey(String name, ArtistType type) {
     final n = name.trim().toLowerCase();
     if (n.isEmpty) return null;
     if (type == ArtistType.artist) return 'a:$n';
     if (type == ArtistType.group) return 'g:$n';
     if (type == ArtistType.series) return 's:$n';
     if (type == ArtistType.character) return 'c:$n';
     return null;
     }
     void _buildVec(_Profile p) {
     p.vec.clear();
     p.weights.forEach((token, w) {
     final key = HentaiIndex.tagIndex[token.replaceAll('_', ' ')];
     if (key != null) p.vec[key.toString()] = w;
     });
     }
     Future<void> _buildTasteProfile(_Profile p) async {
     _setStatus('AI가 내 취향 분석 중...');
     final metas = _bookmarkMetas;
     p.sourceCount = metas.length;
     final tagCount = <String, int>{};
     final artistCount = <(String, ArtistType), int>{};
     final langCount = <String, int>{};
     final pages = <int>[];
     for (final m in metas.values) {
     final seen = <String>{};
     for (final (group, name) in _tagsOf(m)) {
     final token = _tokenOf(group, name);
     if (token.isEmpty || _isExcluded(token) || !seen.add(token)) continue;
     tagCount[token] = (tagCount[token] ?? 0) + 1;
     }
     for (final a in _splitNames(m.artists())) {
     final k = (a, ArtistType.artist);
     artistCount[k] = (artistCount[k] ?? 0) + 1;
     }
     for (final g in _splitNames(m.groups())) {
     final k = (g, ArtistType.group);
     artistCount[k] = (artistCount[k] ?? 0) + 1;
     }
     final lang = '${m.result['Language'] ?? ''}'.trim().toLowerCase();
     if (lang.isNotEmpty && lang != 'n/a') {
     langCount[lang] = (langCount[lang] ?? 0) + 1;
     }
     final pg = _pages(m) ?? 0;
     if (pg > 0) pages.add(pg);
     }
     final total = max(1, metas.length);
     final favShare = <String, double>{};
     var favN = 0;
     for (final (name, type) in _favArtists.take(40)) {
     if (type != ArtistType.artist && type != ArtistType.group) continue;
     final share = _artistShare(name, type);
     if (share.isEmpty) continue;
     favN++;
     share.forEach((t, v) => favShare[t] = (favShare[t] ?? 0) + v);
     }
     if (favN > 0) favShare.updateAll((t, v) => v / favN);
     final favTags = {
     for (final ft in Settings.favoriteTags.value) _norm(ft),
     }..removeWhere((t) => t.isEmpty || _isExcluded(t));
     final raw = <String, double>{};
     tagCount.forEach((t, c) => raw[t] = c / total);
     favShare.forEach((t, v) => raw[t] = (raw[t] ?? 0) + 0.6 * v);
     for (final t in favTags) {
     raw[t] = (raw[t] ?? 0) + 0.8;
     }
     _finishWeights(p, raw);
     _anTags = [
     for (final t in p.weights.keys.take(8))
     (t, ((tagCount[t] ?? 0) * 100 / total).round()),
     ];
     final favTop = favShare.entries.toList()
     ..sort(
     (a, b) => (b.value * _idf(b.key)).compareTo(a.value * _idf(a.key)),
     );
     _anFavTags = favTop.take(6).map((e) => e.key).toList();
     final arts = artistCount.entries.where((e) => e.value >= 2).toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     _anArtists = [for (final e in arts.take(8)) (e.key.$1, e.value)];
     final langs = langCount.entries.toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     _anLangs = [
     for (final e in langs.take(3)) (e.key, (e.value * 100 / total).round()),
     ];
     pages.sort();
     _anPages = pages.isEmpty ? null : pages[pages.length ~/ 2];
     final favNames = _favArtists.map((e) => e.$1).toSet();
     final bmArtists = [
     for (final e in arts.take(15))
     if (!favNames.contains(e.key.$1)) e.key,
     ];
     p.artists = [..._favArtists, ...bmArtists];
     final favBases =
     _favArtists
     .where((e) => e.$2 == ArtistType.artist || e.$2 == ArtistType.group)
     .toList()
     ..shuffle(_rand);
     p.simBases = [...favBases, ...bmArtists].take(_kSimilarBases).toList();
     _buildVec(p);
     p.weights.forEach((t, v) => p.model.prior['t:$t'] = 1.2 * v);
     for (final (name, type) in _favArtists) {
     final k = _artistKey(name, type);
     if (k != null) p.model.prior[k] = 2.0;
     }
     await _trainModel(p, _Mode.taste);
     }
     Future<void> _buildRecentProfile(_Profile p) async {
     _setStatus('최근 본 작품 분석 중...');
     final recent = _recentReadIds.take(_kRecentLimit).toList();
     final metas = <int, QueryResult>{
     for (final id in recent)
     if (_readMetas[id] != null) id: _readMetas[id]!,
     };
     final missing = await _loadMetadata(
     recent.where((e) => !metas.containsKey(e)).toList(),
     maxNetwork: _kNetworkFetchLimit,
     );
     metas.addAll(missing);
     _readMetas.addAll(missing);
     p.sourceCount = metas.length;
     final artistW = <(String, ArtistType), double>{};
     final raw = <String, double>{};
     for (var i = 0; i < recent.length; i++) {
     final m = metas[recent[i]];
     if (m == null) continue;
     final w = 1.0 / (1.0 + i / 8.0); // 최근에 본 것일수록 크게
     final seen = <String>{};
     for (final (group, name) in _tagsOf(m)) {
     final token = _tokenOf(group, name);
     if (token.isEmpty || _isExcluded(token) || !seen.add(token)) continue;
     raw[token] = (raw[token] ?? 0) + w;
     }
     for (final a in _splitNames(m.artists())) {
     final k = (a, ArtistType.artist);
     artistW[k] = (artistW[k] ?? 0) + w;
     }
     for (final g in _splitNames(m.groups())) {
     final k = (g, ArtistType.group);
     artistW[k] = (artistW[k] ?? 0) + w;
     }
     }
     final ranked = artistW.entries.toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     _finishWeights(p, raw);
     p.artists = ranked.take(10).map((e) => e.key).toList();
     p.simBases = List.of(p.artists);
     _buildVec(p);
     p.weights.forEach((t, v) => p.model.prior['t:$t'] = 1.2 * v);
     for (final (name, type) in p.artists) {
     final k = _artistKey(name, type);
     if (k != null) p.model.prior[k] = 1.0;
     }
     await _trainModel(p, _Mode.recent);
     }
     Future<void> _trainModel(_Profile p, _Mode mode) async {
     final data = <_Sample>[];
     final used = <int>{};
     var wPos = 0.0;
     var nPos = 0;
     var nNeg = 0;
     void add(int id, QueryResult? q, bool positive, double w) {
     if (q == null || !used.add(id)) return;
     final f = _featsOf(id, q);
     if (f.isEmpty) return;
     data.add(_Sample(f, positive ? 1.0 : 0.0, w));
     if (positive) {
     wPos += w;
     nPos++;
     } else {
     nNeg++;
     }
     }
     _feedback.forEach((id, v) => add(id, _fbMetas[id], v > 0, 2.0));
     if (mode == _Mode.taste) {
     final bms = _bookmarkMetas.entries.toList()..shuffle(_rand);
     for (final e in bms.take(1500)) {
     add(e.key, e.value, true, 1.0);
     }
     for (final id in _recentReadIds.take(800)) {
     final eng = _engagement(id);
     if (eng > 0) {
     add(
     id,
     _readMetas[id],
     true,
     (_readSessions[id] ?? 1) >= 2 ? 1.2 : 0.7,
     );
     } else if (eng < 0) {
     add(id, _readMetas[id], false, 0.5);
     }
     }
     } else {
     final recent = _recentReadIds.take(_kRecentLimit).toList();
     for (var i = 0; i < recent.length; i++) {
     final id = recent[i];
     final rw = 1.0 / (1.0 + i / 8.0);
     final eng = _engagement(id);
     if (eng < 0) {
     add(id, _readMetas[id], false, 0.6 * rw);
     } else {
     add(id, _readMetas[id], true, (eng > 0 ? 1.5 : 0.9) * rw);
     }
     }
     final bms = _bookmarkMetas.entries.toList()..shuffle(_rand);
     for (final e in bms.take(150)) {
     add(e.key, e.value, true, 0.25);
     }
     }
     if (mode == _Mode.taste) {
     _shownMetas.forEach((id, q) => add(id, q, false, 0.1));
     }
     if (_background.isNotEmpty && wPos > 0) {
     final n = min(_background.length, max(150, nPos * 2));
     final bg = List<QueryResult>.of(_background)..shuffle(_rand);
     final bw = (wPos / n).clamp(0.05, 3.0).toDouble();
     for (final q in bg.take(n)) {
     final id = _idOf(q);
     if (id != null) add(id, q, false, bw);
     }
     }
     p.posCount = nPos;
     p.negCount = nNeg;
     if (nPos == 0 || nNeg < 30) return; // 비교할 작품이 부족하면 기본 분석만 써요
     _setStatus('AI 학습 중... (좋아한 작품 $nPos개, 비교 작품 $nNeg개)');
     await p.model.train(data, _rand);
     }
     void _addCand(
     _Profile p,
     QueryResult q,
     double bonus,
     String reason,
     _Src src,
     ) {
     final id = _idOf(q);
     if (id == null || !_isNew(id) || _hasExcluded(q)) return;
     final pages = _pages(q) ?? 0;
     if (pages > 0 && pages < _kMinPages) return;
     final checked = _pageCache[id] ?? 0;
     if (checked > 0 && checked < _kMinPages) return;
     final tk = _titleKey(q);
     if (tk.isNotEmpty &&
     (_ownTitles.contains(tk) || _seenTitles.contains(tk))) {
     return;
     }
     final old = p.pool[id];
     if (old == null || bonus > old.bonus) {
     p.pool[id] = _Cand(id, q, bonus, reason, src);
     }
     }
     int _available(_Profile p) => p.pool.keys.where(_isNew).length;
     int? _knownPages(_Cand c) {
     final pg = _pages(c.q) ?? 0;
     if (pg > 0) return pg;
     return _pageCache[c.id];
     }
     Future<void> _verifyPages(List<_Cand> list) async {
     final unknown = list.where((c) => _knownPages(c) == null).toList();
     if (unknown.isEmpty) return;
     for (var i = 0; i < unknown.length; i += 10) {
     final chunk = unknown.skip(i).take(10).toList();
     await Future.wait(
     chunk.map((c) async {
     try {
     final provider = await getImageProvider(
     c.q,
     ).timeout(const Duration(seconds: 5));
     _pageCache[c.id] = provider.length();
     } catch (_) {
     _pageCache[c.id] = -1;
     }
     }),
     );
     }
     _saveCaches();
     }
     List<_Cand> _unknownTop(_Profile p, int n) {
     final list = <(_Cand, double)>[];
     for (final c in p.pool.values) {
     if (!_isNew(c.id) || _knownPages(c) != null) continue;
     list.add((c, p.model.logit(_featsOf(c.id, c.q)) + c.bonus));
     }
     list.sort((a, b) => b.$2.compareTo(a.$2));
     return list.take(n).map((e) => e.$1).toList();
     }
     Future<void> _prefetchPages(_Profile p) async {
     if (_prefetching) return;
     _prefetching = true;
     try {
     await _verifyPages(_unknownTop(p, 30));
     } catch (_) {
     } finally {
     _prefetching = false;
     }
     }
     String _and(String sql, String cond) =>
     sql.contains('WHERE') ? '$sql AND $cond' : '$sql WHERE $cond';
     String _withFilters(String tokens) => _and(
     translate2query(
     '$tokens ${Settings.includeTags.value} ${Settings.serializedExcludeTags}'
     .trim(),
     ),
     '(Files IS NULL OR Files <= 0 OR Files >= $_kMinPages)',
     );
     Future<List<QueryResult>> _localQuery(
     String tokens, {
     required int limit,
     required int maxPage,
     }) async {
     try {
     final sql = _withFilters(tokens);
     var page = maxPage <= 1 ? 0 : _rand.nextInt(maxPage);
     for (var i = 0; i < 3; i++) {
     final qm = QueryManager.queryPagination(sql, limit);
     qm.curPage = page;
     final list = await qm.next().timeout(const Duration(seconds: 10));
     if (list.isNotEmpty || page == 0) return list;
     page = page ~/ 4;
     }
     } catch (_) {}
     return [];
     }
     String _tagLabel(_Mode mode) =>
     mode == _Mode.taste ? '취향 태그' : '최근 본 작품과 비슷함';
     Future<void> _quickFill(_Profile p, _Mode mode, int chunks) async {
     if (!_hasDb) return;
     final span = (_maxId! - _minId!).toDouble();
     for (var i = 0; i < chunks; i++) {
     final before = _maxId! + 1 - (span * pow(_rand.nextDouble(), 2)).toInt();
     final sql = _and(_withFilters(''), 'Id < $before');
     List<QueryResult> rows;
     try {
     rows = await QueryManager.queryPagination(
     sql,
     _kChunkSize,
     ).next().timeout(const Duration(seconds: 8));
     } catch (_) {
     continue;
     }
     final scored = <(QueryResult, double)>[];
     for (final q in rows) {
     final id = _idOf(q);
     if (id == null || !_isNew(id)) continue;
     final s = p.model.logit(_featsOf(id, q));
     if (s > 0) scored.add((q, s));
     }
     scored.sort((a, b) => b.$2.compareTo(a.$2));
     for (final (q, _) in scored.take(_kKeepPerChunk)) {
     _addCand(p, q, 0, 'AI 추천', _Src.ai);
     }
     }
     }
     String? _pickToken(_Profile p) {
     final entries = p.weights.entries.toList();
     if (entries.isEmpty) return null;
     final ws = entries.map((e) => sqrt(e.value)).toList();
     var r = _rand.nextDouble() * ws.fold<double>(0, (a, b) => a + b);
     for (var i = 0; i < entries.length; i++) {
     r -= ws[i];
     if (r <= 0) return entries[i].key;
     }
     return entries.last.key;
     }
     Future<void> _fillTags(_Profile p, _Mode mode, int n) async {
     final tried = <String>{};
     for (var k = 0; k < n; k++) {
     final token = _pickToken(p);
     if (token == null) return;
     if (!tried.add(token)) continue;
     if (_hasDb) {
     for (final q in await _localQuery(token, limit: 30, maxPage: 15)) {
     _addCand(p, q, 0.1, '${_tagLabel(mode)}: $token', _Src.tag);
     }
     } else {
     final ids = await _fetchIds(token);
     final fresh = ids.where(_isNew).toList()..shuffle(_rand);
     final metas = await _loadMetadata(
     fresh.take(12).toList(),
     maxNetwork: 12,
     );
     for (final q in metas.values) {
     _addCand(p, q, 0.1, '${_tagLabel(mode)}: $token', _Src.tag);
     }
     }
     }
     }
     bool _safeName(String n) =>
     n.isNotEmpty &&
     !n.contains("'") &&
     !n.contains('"') &&
     !n.contains('(') &&
     !n.contains(')');
     String _orTokens(Iterable<(String, ArtistType)> list) =>
     '(${list.map((e) => '${e.$2.name}:${e.$1.replaceAll(' ', '_')}').join(' or ')})';
     String? _matchName(QueryResult q, Iterable<String> names) {
     final hay =
     '|${q.artists()}|${q.groups() ?? ''}|'
     '${q.result['Series'] ?? ''}|${q.result['Characters'] ?? ''}|'
     .toLowerCase();
     for (final n in names) {
     if (hay.contains('|${n.toLowerCase()}|')) return n;
     }
     return null;
     }
     Future<List<QueryResult>> _networkArtists(
     Iterable<(String, ArtistType)> list,
     ) async {
     final out = <QueryResult>[];
     for (final (name, type) in list) {
     try {
     final r = await HybridLoader.fetchArtistArticlesHybrid(
     name: name,
     type: type.name,
     language: _lang(),
     ).timeout(const Duration(seconds: 15));
     out.addAll((List<QueryResult>.of(r)..shuffle(_rand)).take(10));
     } catch (_) {}
     }
     return out;
     }
     Future<void> _fillArtists(_Profile p, _Mode mode) async {
     final list = p.artists.where((e) => _safeName(e.$1)).toList();
     if (mode == _Mode.taste) list.shuffle(_rand);
     if (list.isEmpty) return;
     final use = list.take(20).toList();
     final rows = _hasDb
     ? await _localQuery(_orTokens(use), limit: 60, maxPage: 5)
     : await _networkArtists(use.take(3));
     final names = use.map((e) => e.$1).toList();
     final favNames = _favArtists.map((e) => e.$1).toSet();
     for (final q in rows) {
     final who = _matchName(q, names);
     final String label;
     if (mode == _Mode.recent) {
     label = '최근 본 작가';
     } else if (who != null && !favNames.contains(who)) {
     label = '자주 북마크한 작가';
     } else {
     label = '즐겨찾는 작가';
     }
     _addCand(
     p,
     q,
     label == '즐겨찾는 작가' ? 0.6 : 0.45,
     who == null ? label : '$label: $who',
     _Src.artist,
     );
     }
     }
     Future<void> _computeSimilarSome(_Profile p, int n) async {
     final own = {
     ...p.artists.map((e) => e.$1),
     ..._favArtists.map((e) => e.$1),
     };
     var done = 0;
     var computed = false;
     while (done < n && p.simBaseCursor < p.simBases.length) {
     final (name, type) = p.simBases[p.simBaseCursor++];
     done++;
     final isGroup = type == ArtistType.group;
     final key = '${type.name}:$name';
     var sims = _simCache[key];
     if (sims == null) {
     await Future<void>.delayed(Duration.zero);
     try {
     sims = (isGroup
     ? HentaiIndex.calculateSimilarGroups(name)
     : HentaiIndex.calculateSimilarArtists(name))
     .take(_kSimilarPerArtist)
     .toList();
     } catch (_) {
     sims = [];
     }
     _simCache[key] = sims;
     computed = true;
     }
     final vecs = isGroup ? HentaiIndex.tagGroup : HentaiIndex.tagArtist;
     final found = <(String, ArtistType, double, String)>[];
     for (final (other, _) in sims) {
     if (own.contains(other) ||
     !_safeName(other) ||
     p.similarNames.contains(other)) {
     continue;
     }
     final vec = vecs[other];
     final match = (p.vec.isNotEmpty && vec is Map<String, dynamic>)
     ? Distance.cosineDistance(p.vec, vec)
     : 0.0;
     found.add((other, type, match, name));
     }
     found.sort((a, b) => b.$3.compareTo(a.$3));
     var kept = found.where((e) => e.$3 >= _kMinMatch).toList();
     if (kept.isEmpty) kept = found.take(2).toList();
     for (final e in kept) {
     if (p.similarNames.add(e.$1)) p.similar.add(e);
     }
     }
     p.similar.sort((a, b) => b.$3.compareTo(a.$3));
     if (computed) _saveCaches();
     }
     Future<void> _fillSimilar(_Profile p, _Mode mode) async {
     await _computeSimilarSome(p, 5);
     if (p.similar.isEmpty) return;
     var pick = p.similar
     .where((e) => !p.usedSimilar.contains(e.$1))
     .take(12)
     .toList();
     if (pick.isEmpty) {
     p.usedSimilar.clear();
     pick = p.similar.take(12).toList();
     }
     p.usedSimilar.addAll(pick.map((e) => e.$1));
     final pairs = pick.map((e) => (e.$1, e.$2));
     final rows = _hasDb
     ? await _localQuery(_orTokens(pairs), limit: 150, maxPage: 3)
     : await _networkArtists(pairs.take(4));
     final names = pick.map((e) => e.$1).toList();
     final byArtist = <String, List<(QueryResult, double)>>{};
     for (final q in rows) {
     final who = _matchName(q, names);
     final id = _idOf(q);
     if (who == null || id == null) continue;
     byArtist
     .putIfAbsent(who, () => [])
     .add((q, p.model.logit(_featsOf(id, q))));
     }
     for (final e in byArtist.entries) {
     final info = pick.firstWhere((x) => x.$1 == e.key);
     final list = e.value..sort((a, b) => b.$2.compareTo(a.$2));
     for (final (q, _) in list.where((x) => x.$2 >= 0).take(4)) {
     _addCand(
     p,
     q,
     0.3 + 0.5 * info.$3,
     '비슷한 작가: ${e.key} (${info.$4} 기준)',
     _Src.similar,
     );
     }
     }
     }
     List<int> _pickSeeds(_Profile p, _Mode mode, int n) {
     final liked = _feedback.entries
     .where((e) => e.value > 0)
     .map((e) => e.key)
     .toList()
     .reversed
     .toList();
     final List<int> base;
     if (mode == _Mode.recent) {
     base = [...liked.take(5), ..._recentReadIds.take(_kRecentLimit)];
     } else {
     final mix = [
     ..._recentReadIds
     .take(300)
     .where((id) => _engagement(id) > 0)
     .take(30),
     ..._bookmarkMetas.keys,
     ]..shuffle(_rand);
     base = [...liked, ...mix];
     }
     final out = <int>[];
     for (final id in base) {
     if (out.length >= n) break;
     if (p.usedSeeds.add(id)) out.add(id);
     }
     return out;
     }
     Future<void> _fillRelated(_Profile p, _Mode mode) async {
     final seeds = _pickSeeds(p, mode, 6);
     if (seeds.isEmpty) return;
     final relSeed = <int, int>{};
     await Future.wait(
     seeds.map((seed) async {
     try {
     final info = await FirstPageGrouper.getGalleryInfo(
     seed,
     ).timeout(const Duration(seconds: 4));
     final rel = info == null ? null : info['related'];
     if (rel is List) {
     for (final e in rel.take(8)) {
     final rid = int.tryParse('$e');
     if (rid != null && _isNew(rid)) relSeed.putIfAbsent(rid, () => seed);
     }
     }
     } catch (_) {}
     }),
     );
     if (relSeed.isEmpty) return;
     final metas = await _loadMetadata(relSeed.keys.toList(), maxNetwork: 12);
     metas.forEach((rid, q) {
     final seed = relSeed[rid];
     final sq = seed == null
     ? null
     : (_bookmarkMetas[seed] ?? _readMetas[seed] ?? _fbMetas[seed]);
     final name = sq == null ? '' : _shortTitle(sq);
     _addCand(
     p,
     q,
     0.35,
     name.isEmpty ? '좋아한 작품과 비슷함' : '‘$name’과(와) 비슷함',
     _Src.related,
     );
     });
     }
     Future<void> _backgroundFill(_Mode mode) async {
     if (!_fillingModes.add(mode)) return;
     final p = _profiles[mode]!;
     if (mounted) setState(() {});
     try {
     await Future.wait([
     _fillSimilar(p, mode),
     _fillArtists(p, mode),
     _fillRelated(p, mode),
     ]).timeout(const Duration(seconds: 30));
     await _fillTags(p, mode, 3);
     await _quickFill(p, mode, 4);
     await _verifyPages(_unknownTop(p, 60));
     } catch (_) {
     } finally {
     _fillingModes.remove(mode);
     if (mounted) {
     if (_mode == mode && !_loading && _results.isEmpty) {
     _draw();
     } else {
     setState(() {});
     }
     }
     }
     }
     Future<Map<int, QueryResult>> _loadMetadata(
     List<int> ids, {
     required int maxNetwork,
     }) async {
     final out = <int, QueryResult>{};
     if (ids.isEmpty) return out;
     for (var i = 0; i < ids.length; i += 400) {
     try {
     final local = await QueryManager.queryIds(
     ids.sublist(i, min(i + 400, ids.length)),
     ).timeout(const Duration(seconds: 10));
     for (final q in local) {
     final id = _idOf(q);
     if (id != null) out[id] = q;
     }
     } catch (_) {}
     }
     var rest = ids.where((e) => !out.containsKey(e)).toList();
     for (var i = 0; i < rest.length; i += 400) {
     try {
     out.addAll(
     await HybridLoader.getCachedMetadataBatch(
     rest.sublist(i, min(i + 400, rest.length)),
     ).timeout(const Duration(seconds: 10)),
     );
     } catch (_) {}
     }
     rest = ids.where((e) => !out.containsKey(e)).take(maxNetwork).toList();
     for (var i = 0; i < rest.length; i += 6) {
     final chunk = rest.skip(i).take(6).toList();
     final fetched = await Future.wait(
     chunk.map((id) async {
     try {
     return await HybridLoader.idQueryHitomiFast(
     id,
     ).timeout(const Duration(seconds: 6));
     } catch (_) {
     return null;
     }
     }),
     );
     for (var j = 0; j < chunk.length; j++) {
     final q = fetched[j];
     if (q != null) out[chunk[j]] = q;
     }
     }
     return out;
     }
     Future<List<int>> _fetchIds(String token) async {
     var maxPage = 12;
     for (var i = 0; i < 3; i++) {
     final page = _rand.nextInt(maxPage);
     try {
     final ids = await HybridLoader.fetchGalleryIdsForQuery(
     query: token,
     page: page,
     pageSize: 30,
     targetLang: _lang(),
     ).timeout(const Duration(seconds: 15));
     if (ids.isNotEmpty) return ids;
     } catch (_) {}
     if (maxPage == 1) break;
     maxPage = max(1, maxPage ~/ 4);
     }
     return [];
     }
     Future<void> _enterMode(_Mode mode) async {
     setState(() {
     _mode = mode;
     _loading = true;
     _results = [];
     _message = null;
     _drawInfo = '';
     });
     final p = _profiles[mode]!;
     if (!p.built) {
     try {
     if (mode == _Mode.taste) {
     await _buildTasteProfile(p);
     } else {
     await _buildRecentProfile(p);
     }
     } catch (_) {}
     p.built = true;
     }
     if (!mounted || _mode != mode) return;
     if (p.weights.isEmpty && p.artists.isEmpty && p.posCount == 0) {
     setState(() {
     _loading = false;
     _message = mode == _Mode.taste
     ? '북마크한 작품, 즐겨찾기 태그, 즐겨찾는 작가가 아직 없어요.\n'
     '마음에 드는 작품을 북마크하면 AI가 취향을 배워서 추천해 드려요.'
     : '최근 본 작품이 아직 없어요.\n'
     '작품을 몇 개 보고 오면 비슷한 작품을 추천해 드려요.';
     });
     return;
     }
     if (_available(p) < _kResultCount) {
     await _step('취향에 맞는 작품 찾는 중...', () async {
     await Future.wait([
     _hasDb ? _quickFill(p, mode, 3) : _fillTags(p, mode, 3),
     _fillArtists(p, mode),
     _fillSimilar(p, mode),
     ]);
     });
     }
     if (!mounted || _mode != mode) return;
     _backgroundFill(mode);
     await _draw();
     }
     Future<void> _draw() async {
     if (_drawing) return;
     _drawing = true;
     try {
     await _drawInner();
     } finally {
     _drawing = false;
     }
     if (mounted) _prefetchPages(_p);
     }
     double _quality(int id) {
     if (!Population.isLoaded) return 0.0;
     final pop = Population.population;
     final r = pop[id];
     if (r == null || pop.isEmpty) return 0.0;
     final x = 1 - r / (pop.length * 0.5);
     return x <= 0 ? 0.0 : 0.3 * x;
     }
     double _jaccard(Set<String> a, Set<String> b) {
     if (a.isEmpty || b.isEmpty) return 0.0;
     var inter = 0;
     for (final x in a) {
     if (b.contains(x)) inter++;
     }
     return inter / (a.length + b.length - inter);
     }
     double _novelty(_Profile p, _Cand c) {
     final tags = _tagSet(c);
     if (tags.isEmpty) return 0.0;
     var unknown = 0;
     for (final t in tags) {
     if (p.model.value(t).abs() < 0.15) unknown++;
     }
     return unknown / tags.length;
     }
     Future<void> _drawInner() async {
     final p = _p;
     final mode = _mode;
     final keyed = <(_Cand, double, double, double)>[];
     for (final c in p.pool.values) {
     if (!_isNew(c.id)) continue;
     final m = p.model.logit(_featsOf(c.id, c.q));
     final z = (m + c.bonus + _quality(c.id)).clamp(-12.0, 12.0).toDouble();
     final u = max(_rand.nextDouble(), 1e-12);
     keyed.add((c, z, log(u) / exp(z / _kTemp), m));
     }
     keyed.sort((a, b) => b.$3.compareTo(a.$3));
     final head = keyed
     .where((e) => e.$2 >= _kMinLogit)
     .take(_kResultCount + 8)
     .map((e) => e.$1)
     .toList();
     if (head.any((c) => _knownPages(c) == null)) {
     if (_results.isEmpty) _setStatus('작품 페이지 수 확인 중...');
     await _verifyPages(head);
     if (!mounted || _mode != mode) return;
     }
     final picked = <_Cand>[];
     final pickedTitles = <String>{};
     final pickedTags = <Set<String>>[];
     final perArtist = <String, int>{};
     final perSrc = <_Src, int>{};
     var explored = 0;
     bool tryPick(_Cand c, double m, bool explore) {
     if (picked.length >= _kResultCount || picked.contains(c)) return false;
     final pg = _knownPages(c) ?? 0;
     if (pg > 0 && pg < _kMinPages) {
     p.pool.remove(c.id);
     return false;
     }
     final n = perSrc[c.src] ?? 0;
     if (c.src == _Src.artist && n >= _kMaxArtistSourcePerDraw) return false;
     if (c.src == _Src.similar && n >= _kMaxSimilarPerDraw) return false;
     if (c.src == _Src.related && n >= _kMaxRelatedPerDraw) return false;
     final who = _mainArtist(c.q);
     if (who.isNotEmpty && (perArtist[who] ?? 0) >= _kMaxPerArtist) {
     return false;
     }
     final tk = _titleKey(c.q);
     if (tk.isNotEmpty && pickedTitles.contains(tk)) return false;
     final tags = _tagSet(c);
     for (final other in pickedTags) {
     if (_jaccard(tags, other) >= _kMaxOverlap) return false;
     }
     if (tk.isNotEmpty) pickedTitles.add(tk);
     pickedTags.add(tags);
     if (who.isNotEmpty) perArtist[who] = (perArtist[who] ?? 0) + 1;
     perSrc[c.src] = n + 1;
     final pct = (_TasteModel.sig(m) * 100).round();
     c.explore = explore;
     c.label = explore
     ? '새로운 발견 · AI 예상 취향 $pct%'
     : '${c.reason} · 취향 $pct%';
     picked.add(c);
     return true;
     }
     for (final e in keyed) {
     if (explored >= _kExploreSlots) break;
     if (e.$1.src != _Src.ai || e.$4 < 0.3) continue;
     if (_novelty(p, e.$1) < 0.5) continue;
     if (tryPick(e.$1, e.$4, true)) explored++;
     }
     for (final e in keyed) {
     if (picked.length >= _kResultCount) break;
     if (e.$2 < _kMinLogit) continue;
     tryPick(e.$1, e.$4, false);
     }
     for (final e in keyed) {
     if (picked.length >= _kResultCount) break;
     tryPick(e.$1, e.$4, false);
     }
     final order = <int, int>{};
     for (var i = 0; i < keyed.length; i++) {
     order[keyed[i].$1.id] = i;
     }
     picked.sort((a, b) => (order[a.id] ?? 0).compareTo(order[b.id] ?? 0));
     for (final c in picked) {
     _shownIds.add(c.id);
     _seenOrder.add(c.id);
     p.pool.remove(c.id);
     }
     for (final t in pickedTitles) {
     if (_seenTitles.add(t)) _seenTitleOrder.add(t);
     }
     _saveSeen();
     _rollCount++;
     final parts = <String>[];
     void addPart(String name, int n) {
     if (n > 0) parts.add('$name $n개');
     }
     addPart(
     'AI 추천',
     picked.where((c) => !c.explore && c.src == _Src.ai).length,
     );
     addPart('새로운 발견', explored);
     addPart(_tagLabel(mode), perSrc[_Src.tag] ?? 0);
     addPart(
     mode == _Mode.taste ? '좋아하는 작가' : '최근 본 작가',
     perSrc[_Src.artist] ?? 0,
     );
     addPart('비슷한 작가', perSrc[_Src.similar] ?? 0);
     addPart('비슷한 작품', perSrc[_Src.related] ?? 0);
     setState(() {
     _loading = false;
     _status = '';
     _results = picked;
     _drawInfo = parts.isEmpty ? '' : '이번 추천: ${parts.join(', ')}';
     _message = picked.isEmpty
     ? (_filling
     ? '추천할 작품을 찾는 중이에요.\n잠시만 기다려 주세요.'
     : '추천할 작품을 찾지 못했어요.\n잠시 후 다시 뽑기를 눌러 보세요.')
     : null;
     });
     }
     Future<void> _reroll() async {
     final mode = _mode;
     final p = _p;
     setState(() {
     _loading = true;
     _results = [];
     _status = '다시 뽑는 중...';
     });
     if (_available(p) < _kResultCount) {
     await _step('작품 더 찾는 중...', () async {
     await Future.wait([
     _hasDb ? _quickFill(p, mode, 5) : _fillTags(p, mode, 2),
     _fillArtists(p, mode),
     _fillSimilar(p, mode),
     _fillRelated(p, mode),
     ]);
     });
     if (!mounted || _mode != mode) return;
     }
     if (_available(p) < 70) _backgroundFill(mode);
     await _draw();
     }
     void _onFeedback(_Cand c, int v) {
     final prev = _feedback[c.id] ?? 0;
     final cancel = prev == v;
     setState(() {
     _feedback.remove(c.id);
     if (!cancel) _feedback[c.id] = v;
     if (!cancel && v < 0) _results.remove(c);
     });
     if (!cancel) {
     _fbMetas[c.id] = c.q;
     final f = _featsOf(c.id, c.q);
     for (final prof in _profiles.values) {
     if (prof.built) prof.model.learn(f, v > 0 ? 1.0 : 0.0);
     }
     }
     _saveFeedback();
     final messenger = ScaffoldMessenger.maybeOf(context);
     messenger?.hideCurrentSnackBar();
     messenger?.showSnackBar(
     SnackBar(
     duration: const Duration(milliseconds: 1500),
     content: Text(
     cancel
     ? '취소했어요'
     : (v > 0
     ? '좋아요! 이런 작품을 더 추천할게요'
     : '알겠어요. 이런 작품은 덜 추천할게요'),
     ),
     ),
     );
     }
     String _langKo(String lang) =>
     const {
     'korean': '한국어',
     'japanese': '일본어',
     'english': '영어',
     'chinese': '중국어',
     'spanish': '스페인어',
     'russian': '러시아어',
     }[lang] ??
     lang;
     List<String> _topFeatures(
     _Profile p, {
     required bool positive,
     required bool tags,
     required int n,
     }) {
     final keys = <String>{...p.model.w.keys, ...p.model.prior.keys};
     final list = <(String, double)>[];
     for (final k in keys) {
     final isTag = k.startsWith('t:');
     if (isTag != tags || k.startsWith('y:')) continue;
     final v = p.model.value(k);
     if (positive ? v < 0.4 : v > -0.4) continue;
     if (p.model.trained && !p.model.prior.containsKey(k)) {
     final need = positive ? (isTag ? 4 : 2) : 8;
     if ((p.model.support[k] ?? 0) < need) continue;
     }
     list.add((k, v));
     }
     list.sort(
     (a, b) => positive ? b.$2.compareTo(a.$2) : a.$2.compareTo(b.$2),
     );
     return list.take(n).map((e) => _featLabel(e.$1)).toList();
     }
     String _featLabel(String k) {
     final v = k.length > 2 ? k.substring(2).replaceAll('_', ' ') : k;
     if (k.startsWith('g:')) return '$v(그룹)';
     if (k.startsWith('s:')) return '$v(시리즈)';
     if (k.startsWith('c:')) return '$v(캐릭터)';
     return v;
     }
     List<String> _topTokens(_Profile p, int n) {
     final entries = p.weights.entries.toList()
     ..sort((a, b) => b.value.compareTo(a.value));
     return entries.take(n).map((e) => e.key).toList();
     }
