  - name: Restore signing key
    id: keycache
    if: steps.chk.outputs.ok == '1'
    uses: actions/cache@v4
    with:
     path: violet/android/build-key.jks
     key: violet-build-key-v1
  - name: Keep signing key safe
    if: steps.chk.outputs.ok == '1'
    env:
     GH_TOKEN: ${{ github.token }}
    run: |
     K="$GITHUB_WORKSPACE/violet/android/build-key.jks"
     mkdir -p "$(dirname "$K")"
     AID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name == "signing-key") | .assets[] | select(.name == "build-key.jks") | .id] | first // empty' 2>/dev/null || true)
     if [ ! -s "$K" ] && [ -n "$AID" ]; then
       gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$AID" > "$K" || rm -f "$K"
     fi
     if [ ! -s "$K" ]; then
       echo "새 서명 키를 만들어요"
       keytool -genkeypair -keystore "$K" -storepass violetlite -keypass violetlite -alias violet -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Violet Lite Custom"
     fi
     if [ -z "$AID" ]; then
       gh release create signing-key "$K" --repo "$GITHUB_REPOSITORY" --draft --title "서명 키 보관함 (지우지 마세요)" --notes "앱 업데이트를 덮어서 설치하려면 이 키가 필요해요. 비공개 초안이라 다른 사람은 못 봐요." || echo "서명 키 보관을 못 했어요 (빌드는 계속해요)"
     fi
  - name: Write key.properties
    if: steps.chk.outputs.ok == '1'
    run: |
     printf 'storePassword=violetlite\nkeyPassword=violetlite\nkeyAlias=violet\nstoreFile=%s\n' "$GITHUB_WORKSPACE/violet/android/build-key.jks" > android/key.properties
  - name: Build APK (arm64)
    if: steps.chk.outputs.ok == '1'
    env:
     VIOLET_PREBUILT_RUST: ${{ steps.rust.outputs.dir }}
    run: |
     set -o pipefail
     if [ -n "$VIOLET_PREBUILT_RUST" ]; then echo "Rust: 공식 라이브러리를 그대로 써요"; else echo "Rust: 직접 만들어요 (몇 분 더 걸려요)"; fi
     LOG="$RUNNER_TEMP/build.log"
     if ! { flutter pub get && flutter build apk --release --target-platform android-arm64; } 2>&1 | tee "$LOG"; then
       python3 -I - "$LOG" <<'PY'
     import os
     import re
     import subprocess
     import sys

     lines = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
     ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
     pat = re.compile(
         r'error(\[E\d+\])?:|: Error:|\bERROR:|^e: |Missing class|undefined symbol|'
         r'No space left|SIGKILL|signal: 9|Could not resolve|Could not find|Out of memory|OutOfMemory|'
         r'What went wrong|^\s*--> ',
         re.I,
     )
     picked, seen, after = [], set(), 0
     for raw in lines:
         s = ansi.sub('', raw).replace('SEVERE: ', '').rstrip()
         if not s.strip():
             continue
         if s.startswith('* ') and 'What went wrong' not in s:
             after = 0
             continue
         keep = after > 0
         after = max(0, after - 1)
         if pat.search(s):
             keep = True
             if 'What went wrong' in s:
                 after = 3
         if keep and s not in seen and 'warning:' not in s.lower():
             seen.add(s)
             picked.append(s[:300])
     picked = picked[:40]
     if not picked:
         picked = [ansi.sub('', x).rstrip()[:300] for x in lines[-30:]]


     def run(cmd):
         try:
             return subprocess.run(cmd, capture_output=True, text=True, timeout=20).stdout.strip()
         except Exception:
             return ''


     body = '\n'.join(picked)
     msg = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
     print('::error title=빌드 실패 원인::' + msg)
     summary = os.environ.get('GITHUB_STEP_SUMMARY')
     if summary:
         with open(summary, 'a', encoding='utf-8') as f:
             f.write('## 빌드 실패 원인\n\n이 화면을 캡처해서 보내 주세요.\n\n```text\n')
             f.write(body + '\n```\n\n')
             f.write('```text\n' + run(['df', '-h', '/']) + '\n\n' + run(['free', '-h']) + '\n```\n')
     PY
       exit 1
     fi
  - name: Publish APK to Releases
