     final n = perSrc[c.src] ?? 0;
     if (c.src == _Src.artist && n >= _kMaxArtistSourcePerDraw) return false;
     if (c.src == _Src.similar && n >= _kMaxSimilarPerDraw) return false;
     if (c.src == _Src.related && n >= _kMaxRelatedPerDraw) return false;
     final who = _mainArtist(c.q);
     if (who.isNotEmpty && (perArtist[who] ?? 0) >= _kMaxPerArtist) {
     return false;
     }
     final tk = _titleKey(c.q);
     if (tk.isNotEmpty && pickedTitles.contains(tk)) return false;
     final tags = _tagSet(c);
     for (final other in pickedTags) {
     if (_jaccard(tags, other) >= _kMaxOverlap) return false;
     }
     if (tk.isNotEmpty) pickedTitles.add(tk);
     pickedTags.add(tags);
     if (who.isNotEmpty) perArtist[who] = (perArtist[who] ?? 0) + 1;
     perSrc[c.src] = n + 1;
     final pct = (_TasteModel.sig(m) * 100).round();
     c.explore = explore;
