     import subprocess
     import sys

     lines = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
     level = sys.argv[2] if len(sys.argv) > 2 else 'error'
     title = '빌드 실패 원인' if level == 'error' else '그림체 분석 쪽 빌드 실패 (그림체 없이 다시 만들어요)'
     ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
     pat = re.compile(
         r'error(\[E\d+\])?:|: Error:|\bERROR:|^e: |Missing class|undefined symbol|'
         r'No space left|SIGKILL|signal: 9|Could not resolve|Could not find|Out of memory|OutOfMemory|'
         r'Duplicate class|What went wrong|^\s*--> ',
         re.I,
     )
     picked, seen, after = [], set(), 0
     for raw in lines:
         s = ansi.sub('', raw).replace('SEVERE: ', '').rstrip()
         if not s.strip():
             continue
         if s.startswith('* ') and 'What went wrong' not in s:
             after = 0
             continue
         keep = after > 0
         after = max(0, after - 1)
         if pat.search(s):
             keep = True
             if 'What went wrong' in s:
                 after = 3
         if keep and s not in seen and 'warning:' not in s.lower():
             seen.add(s)
             picked.append(s[:300])
     picked = picked[:40]
     if not picked:
         picked = [ansi.sub('', x).rstrip()[:300] for x in lines[-30:]]


     def run(cmd):
         try:
             return subprocess.run(cmd, capture_output=True, text=True, timeout=20).stdout.strip()
         except Exception:
             return ''


     body = '\n'.join(picked)
     msg = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
     print(f'::{level} title={title}::' + msg)
     summary = os.environ.get('GITHUB_STEP_SUMMARY')
     if summary:
         with open(summary, 'a', encoding='utf-8') as f:
             f.write(f'## {title}\n\n이 화면을 캡처해서 보내 주세요.\n\n```text\n')
             f.write(body + '\n```\n\n')
             f.write('```text\n' + run(['df', '-h', '/']) + '\n\n' + run(['free', '-h']) + '\n```\n')
     PY
     build() {
       { flutter pub get && flutter build apk --release --target-platform android-arm64; } 2>&1 | tee "$LOG"
     }
     if build; then
       exit 0
     fi
     B="$RUNNER_TEMP/style_backup"
     if [ ! -f "$B/applied" ]; then
       python3 -I "$ERR" "$LOG" error
       exit 1
     fi
     # 그림체 분석(새로 넣은 부분) 때문일 수 있어서, 그 부분만 빼고 한 번 더 만들어요.
     python3 -I "$ERR" "$LOG" warning
     echo "그림체 분석 없이 다시 만들어요"
     cp "$B/MainActivity.kt" "$(cat "$B/ma_path")"
     cp "$B/build.gradle.kts" android/app/build.gradle.kts
     cp "$B/proguard-rules.pro" android/app/proguard-rules.pro
     rm -f "$(cat "$B/kt_path")" android/app/src/main/assets/violet_style.tflite "$B/applied"
     if build; then
       echo "style_dropped=1" >> "$GITHUB_OUTPUT"
       exit 0
     fi
     python3 -I "$ERR" "$LOG" error
     exit 1
  - name: Publish APK to Releases
    if: steps.chk.outputs.ok == '1'
    env:
     GH_TOKEN: ${{ github.token }}
     SRC_TAG: ${{ steps.src.outputs.tag }}
     STYLE_NOTE: ${{ steps.build.outputs.style_dropped == '1' && ' · 그림체 분석 빠짐' || '' }}
    run: |
     cp build/app/outputs/flutter-apk/app-release.apk violet-ai.apk
     gh release delete ai-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
     gh release create ai-latest violet-ai.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Violet AI 추천 + 번역 ($SRC_TAG)" --notes "원본 $SRC_TAG · 빌드 번호 $GITHUB_RUN_NUMBER$STYLE_NOTE"
