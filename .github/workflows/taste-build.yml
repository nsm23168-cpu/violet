     double _quality(int id) {
     if (!Population.isLoaded) return 0.0;
     final pop = Population.population;
     final r = pop[id];
     if (r == null || pop.isEmpty) return 0.0;
     final x = 1 - r / (pop.length * 0.5);
     return x <= 0 ? 0.0 : 0.3 * x;
     }
     double _jaccard(Set<String> a, Set<String> b) {
     if (a.isEmpty || b.isEmpty) return 0.0;
     var inter = 0;
     for (final x in a) {
     if (b.contains(x)) inter++;
     }
     return inter / (a.length + b.length - inter);
     }
     double _novelty(_Profile p, _Cand c) {
     final tags = _tagSet(c);
     if (tags.isEmpty) return 0.0;
     var unknown = 0;
     for (final t in tags) {
     if (p.model.value(t).abs() < 0.15) unknown++;
     }
     return unknown / tags.length;
     }
     Future<void> _drawInner() async {
     final p = _p;
     final mode = _mode;
     final keyed = <(_Cand, double, double, double)>[];
     final us = <int, double>{};
     for (final c in p.pool.values) {
     if (!_isNew(c.id)) continue;
     final m = p.model.logit(_featsOf(c.id, c.q));
     final z = (m + c.bonus + _quality(c.id)).clamp(-12.0, 12.0).toDouble();
     final u = max(_rand.nextDouble(), 1e-12);
     us[c.id] = u;
     keyed.add((c, z, log(u) / exp(z / _kTemp), m));
     }
     keyed.sort((a, b) => b.$3.compareTo(a.$3));
     final styleOn = _styleReady;
     final head = keyed
     .where((e) => e.$2 >= _kMinLogit)
     .take(_kResultCount + (styleOn ? 24 : 8))
     .map((e) => e.$1)
     .toList();
     final needPages = head.any((c) => _knownPages(c) == null);
     if (needPages || styleOn) {
     if (_results.isEmpty) {
     _setStatus(styleOn ? '페이지 수와 그림체 확인 중...' : '작품 페이지 수 확인 중...');
     }
