     static const double _kMinMatch = 0.2; // 비슷한 작가가 내 취향과 이만큼은 맞아야 해요
     static const double _kMinLogit = -1.0; // AI 점수가 이보다 낮으면 웬만하면 안 보여줘요
     static const double _kTemp = 0.8; // 낮을수록 점수 높은 작품 위주, 높을수록 다양하게
     static const double _kMaxOverlap = 0.7; // 태그가 이만큼 겹치면 같은 페이지에 안 넣어요
     static const String _kSeenKey = 'ai_recommend_seen_ids';
     static const String _kSeenTitleKey = 'ai_recommend_seen_titles';
     static const String _kSimCacheKey = 'ai_similar_cache_v2';
     static const String _kPageCacheKey = 'ai_page_cache_v1';
     static const String _kFeedbackKey = 'ai_feedback_v1';
     static const String _kHelpKey = 'ai_help_seen_v2';
     static const String _kHelpText = "👍 좋아요\n· 그 작품의 작가와 태그를 AI가 '내가 좋아하는 것'으로 배워요.\n· 바로 아래에 비슷한 작품을 최대 3개 넣어 줘요. (연관 작품, 같은 작가 작품, 그 작가와 비슷한 작가의 작품)\n· 다음 뽑기부터 그 작가 작품과 비슷한 작가의 작품이 더 자주 나와요.\n· 여러 작품에 같은 태그가 자주 나오면 그 태그를 더 좋아한다고 배워요.\n\n👎 별로예요\n· 그 작품을 목록에서 빼요.\n· 그 작품의 태그와 작가는 덜 추천해요.\n· 잘못 눌렀으면 아래 알림의 '되돌리기'를 누르세요.\n\n🎨 그림체\n· 좋아한 작품(👍, 북마크, 끝까지 본 작품)의 표지와 본문 그림 3장을 폰 안의 작은 AI가 분석해요.\n· 선, 채색, 명암, 분위기가 비슷할수록 위로 올리고, 카드에 '그림체 n%'로 보여 줘요. 본문 그림을 표지보다 더 중요하게 봐요.\n· 처음 한 번은 분석에 3~5분 걸려요. 위쪽 '그림체'를 눌러 끄고 켤 수 있어요.\n\n· 같은 버튼을 한 번 더 누르면 취소되고, 배운 것도 되돌려요.\n· 누른 기록은 저장돼서 앱을 다시 켜도 계속 반영돼요.\n· '취향 n%'는 AI가 예상한, 내가 그 작품을 좋아할 확률이에요.";
