     if (_readIds.add(id)) _recentReadIds.add(id);
     _readSessions[id] = (_readSessions[id] ?? 0) + 1;
     final lp = int.tryParse('${entry.result['LastPage'] ?? ''}');
     if (lp != null && lp > (_readMaxPage[id] ?? -1)) _readMaxPage[id] = lp;
     }
     } catch (_) {}
     _setStatus('북마크와 읽은 기록 분석 중...');
     final metas = await Future.wait([
     _loadMetadata(_bookmarkedIds.toList(), maxNetwork: _kNetworkFetchLimit),
     _loadMetadata(_recentReadIds.take(2000).toList(), maxNetwork: 0),
     _loadMetadata(_feedback.keys.toList(), maxNetwork: 30),
     _loadMetadata(
     _prevShown
     .where((e) => !_readIds.contains(e) && !_feedback.containsKey(e))
     .toList(),
     maxNetwork: 0,
     ),
     ]);
     _bookmarkMetas = metas[0];
     _readMetas = metas[1];
     _fbMetas.addAll(metas[2]);
     _shownMetas = metas[3];
     for (final m in [..._bookmarkMetas.values, ..._readMetas.values]) {
     final k = _titleKey(m);
     if (k.isNotEmpty) _ownTitles.add(k);
     }
     for (final id in _recentReadIds) {
