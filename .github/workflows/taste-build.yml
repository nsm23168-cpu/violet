     }
     for (final e in keyed) {
     if (picked.length >= _kResultCount) break;
     if (e.$2 < _kMinLogit) continue;
     tryPick(e.$1, e.$4, false);
     }
     for (final e in keyed) {
     if (picked.length >= _kResultCount) break;
     tryPick(e.$1, e.$4, false);
     }
     final order = <int, int>{};
     for (var i = 0; i < keyed.length; i++) {
     order[keyed[i].$1.id] = i;
     }
     picked.sort((a, b) => (order[a.id] ?? 0).compareTo(order[b.id] ?? 0));
     for (final c in picked) {
