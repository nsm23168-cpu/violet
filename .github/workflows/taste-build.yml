     if (hit != null) return hit;
     if (_simEmpty.contains(key)) return const [];
     List<(String, double)> sims;
     try {
     sims =
     (type == ArtistType.group
     ? HentaiIndex.calculateSimilarGroups(name)
     : HentaiIndex.calculateSimilarArtists(name))
     .take(_kSimilarPerArtist)
     .toList();
     } catch (_) {
     sims = [];
     }
     if (sims.isEmpty) {
     _simEmpty.add(key);
     } else {
     _simCache[key] = sims;
     _simDirty = true;
     }
     return sims;
     }
     Future<void> _prepareVectors(
     Iterable<(String, ArtistType)> direct,
     List<(String, ArtistType)> bases,
     ) async {
     if (!_needVecFiles) return;
     final artists = <String>{};
     final groups = <String>{};
     void want(String n, ArtistType t) {
     if (t == ArtistType.group) {
     groups.add(n);
     } else if (t == ArtistType.artist) {
     artists.add(n);
     }
     }
     for (final (n, t) in direct) {
     want(n, t);
     }
     for (final (n, t) in bases) {
     if (t != ArtistType.artist && t != ArtistType.group) continue;
     await Future<void>.delayed(Duration.zero);
     for (final (o, _) in _similarOf(n, t)) {
     want(o, t);
     }
     }
     if (_simDirty) {
     _simDirty = false;
     _saveCaches();
     }
     try {
     await _ensureVecs(artists, groups).timeout(const Duration(seconds: 60));
     } catch (_) {}
     }
     Map<String, double> _artistShare(String name, ArtistType type) {
     final v = _vecOf(name, type);
     if (v == null) return const {};
     var top = 0.0;
     v.forEach((k, c) {
     if (c is num && c > top) top = c.toDouble();
     });
     if (top <= 0) return const {};
     final out = <String, double>{};
     v.forEach((k, c) {
     final tok = _idxToToken['$k'];
     if (tok != null && c is num && !_isExcluded(tok)) out[tok] = c / top;
     });
     return out;
     }
     void _finishWeights(_Profile p, Map<String, double> raw) {
     final scored = <(String, double)>[
     for (final e in raw.entries)
     if (e.value > 0) (e.key, e.value * _idf(e.key)),
     ]..sort((a, b) => b.$2.compareTo(a.$2));
     p.weights.clear();
     final top = scored.isEmpty ? 1.0 : scored.first.$2;
     for (final (t, w) in scored.take(_kTasteTokens)) {
     p.weights[t] = w / top;
     }
     }
