     Map<_Mode, Map<String, double?>> _snapshot(List<String> f) => {
     for (final e in _profiles.entries)
     if (e.value.built) e.key: {for (final k in f) k: e.value.model.w[k]},
     };
     void _restore(Map<_Mode, Map<String, double?>> snap) {
     snap.forEach((mode, ws) {
     final m = _profiles[mode]!.model;
     ws.forEach((k, v) {
     if (v == null) {
     m.w.remove(k);
     } else {
     m.w[k] = v;
     }
     final s = (m.support[k] ?? 1) - 1;
     if (s <= 0) {
     m.support.remove(k);
     } else {
     m.support[k] = s;
     }
     });
     });
     }
     List<String> _fbNames(List<String> f, bool like) {
     final m = _p.model;
     final feats = f.where((k) => !k.startsWith('y:')).toList()
     ..sort(
     (a, b) => like
     ? m.value(b).compareTo(m.value(a))
     : m.value(a).compareTo(m.value(b)),
     );
     final who = feats
     .where((k) => !k.startsWith('t:'))
     .where((k) => like ? m.value(k) > 0 : m.value(k) < 0)
     .take(1)
     .toList();
     final tags = feats
     .where((k) => k.startsWith('t:'))
     .take(who.isEmpty ? 3 : 2)
     .toList();
     return [for (final k in [...who, ...tags]) _featLabel(k)];
     }
     Future<void> _moreLikeThis(_Cand liked) async {
