     gh release create ai-latest violet-ai.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Violet AI 추천 + 번역 ($SRC_TAG)" --notes "원본 $SRC_TAG · 빌드 번호 $GITHUB_RUN_NUMBER"
