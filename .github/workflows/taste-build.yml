name: Build Violet Lite (AI 추천 + 번역)
on:
  push:
  workflow_dispatch:
concurrency:
  group: violet-build
  cancel-in-progress: true
jobs:
 build:
  runs-on: ubuntu-latest
  permissions:
   contents: write
  defaults:
   run:
    working-directory: up/violet
  steps:
  - uses: actions/checkout@v4
    with:
     sparse-checkout: mods
  - name: Check files
    id: chk
    working-directory: ${{ github.workspace }}
    run: |
     if [ -s mods/tr.txt ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "mods/tr.txt 가 아직 없어서 빌드는 건너뛰어요"; fi
  - name: Get latest Violet Lite source
    id: src
    if: steps.chk.outputs.ok == '1'
    working-directory: ${{ github.workspace }}
    run: |
     REPO=https://github.com/hanyuec8/violet-lite
     TAG=$(git ls-remote --tags --refs "$REPO" | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-lite$' | sort -V | tail -n 1 || true)
     rm -rf up
     if [ -n "$TAG" ]; then
       git clone --depth 1 --branch "$TAG" "$REPO" up
     else
       TAG=dev
       git clone --depth 1 "$REPO" up
     fi
     FV=$(grep -m1 -E '^\s+flutter:\s*"?[0-9]+\.[0-9]+\.[0-9]+' up/violet/pubspec.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
     echo "원본 버전: $TAG / Flutter ${FV:-3.35.4}"
     echo "tag=$TAG" >> "$GITHUB_OUTPUT"
     echo "flutter=${FV:-3.35.4}" >> "$GITHUB_OUTPUT"
  - name: Add taste recommend page
    if: steps.chk.outputs.ok == '1'
    run: |
     cat > lib/pages/bookmark/taste_recommend_page.dart <<'DART'
     import 'dart:async';
     import 'dart:convert';
     import 'dart:io';
     import 'dart:math';
     import 'dart:typed_data';
     import 'package:flutter/foundation.dart' show compute;
     import 'package:flutter/material.dart';
     import 'package:flutter/services.dart';
     import 'package:http/http.dart' as http;
     import 'package:path_provider/path_provider.dart';
     import 'package:provider/provider.dart';
     import 'package:shared_preferences/shared_preferences.dart';
     import 'package:violet/algorithm/distance.dart';
     import 'package:violet/component/hitomi/first_page_grouper.dart';
     import 'package:violet/component/hitomi/hybrid_loader.dart';
     import 'package:violet/component/hitomi/population.dart';
     import 'package:violet/component/hitomi/tag_translate.dart';
     import 'package:violet/component/index.dart';
     import 'package:violet/component/query_translate.dart';
     import 'package:violet/database/database.dart';
     import 'package:violet/database/query.dart';
     import 'package:violet/database/user/bookmark.dart';
     import 'package:violet/database/user/record.dart';
     import 'package:violet/model/article_list_item.dart';
     import 'package:violet/pages/common/utils.dart';
     import 'package:violet/script/script_manager.dart';
     import 'package:violet/settings/settings.dart';
     import 'package:violet/widgets/article_item/article_list_item_widget.dart';
     Map<String, dynamic> _readJsonMap(String path) {
     try {
     final v = jsonDecode(File(path).readAsStringSync());
     if (v is Map<String, dynamic>) return v;
     } catch (_) {}
     return <String, dynamic>{};
     }
     Map<String, dynamic> _pickVectors(List<String> args) {
     final out = <String, dynamic>{};
     try {
     final all = jsonDecode(File(args.first).readAsStringSync());
     if (all is Map) {
     for (final n in args.skip(1)) {
     final v = all[n];
     if (v is Map) out[n] = v;
     }
     }
     } catch (_) {}
     return out;
     }
     class _Sv {
     _Sv(this.cover, this.inner);
     Int8List? cover; // 표지
     Int8List? inner; // 본문 3장(1/4, 2/4, 3/4 지점)의 평균
     }
     class _Style {
     static const MethodChannel _ch = MethodChannel('xyz.project.violet/style');
     static bool? _ok;
     static final Map<int, _Sv> emb = {};
     static final Set<int> _tried = {}; // 앱을 켠 동안 이미 분석해 본 작품
     static bool _loaded = false;
     static bool _dirty = false;
     static int _active = 0;
     static final List<Completer<void>> _waiters = [];
     static Future<bool> available() async {
     final known = _ok;
     if (known != null) return known;
     var r = false;
     try {
     r =
     await _ch
     .invokeMethod<bool>('available')
     .timeout(const Duration(seconds: 20)) ??
     false;
     } catch (_) {}
     _ok = r;
     return r;
     }
     static bool complete(int id) {
     if (_tried.contains(id)) return true;
     final v = emb[id];
     return v != null && v.cover != null && v.inner != null;
     }
     static Future<T> _limit<T>(Future<T> Function() job) async {
     while (_active >= 3) {
     final c = Completer<void>();
     _waiters.add(c);
     await c.future;
     }
     _active++;
     try {
     return await job();
     } finally {
     _active--;
     if (_waiters.isNotEmpty) _waiters.removeAt(0).complete();
     }
     }
     static Future<Int8List?> _embedUrl(
     String url,
     Map<String, String> headers,
     ) async {
     try {
     final res = await http
     .get(Uri.parse(url), headers: headers)
     .timeout(const Duration(seconds: 10));
     if (res.statusCode != 200 || res.bodyBytes.isEmpty) return null;
     final out = await _ch
     .invokeMethod<Uint8List>('embed', {'bytes': res.bodyBytes})
     .timeout(const Duration(seconds: 30));
     if (out == null || out.length < 16) return null;
     return Int8List.fromList(out);
     } catch (_) {
     return null;
     }
     }
     static Int8List? _mean(List<Int8List> vs) {
     if (vs.isEmpty) return null;
     final n = vs.first.length;
     final acc = Float64List(n);
     var used = 0;
     for (final v in vs) {
     if (v.length != n) continue;
     var norm = 0.0;
     for (var i = 0; i < n; i++) {
     norm += v[i] * v[i];
     }
     if (norm <= 0) continue;
     final inv = 1 / sqrt(norm);
     for (var i = 0; i < n; i++) {
     acc[i] += v[i] * inv;
     }
     used++;
     }
     if (used == 0) return null;
     var mx = 0.0;
     for (var i = 0; i < n; i++) {
     final a = acc[i].abs();
     if (a > mx) mx = a;
     }
     if (mx <= 0) return null;
     final out = Int8List(n);
     for (var i = 0; i < n; i++) {
     out[i] = (acc[i] / mx * 127).round().clamp(-127, 127).toInt();
     }
     return out;
     }
     static Future<_Sv?> of(int id, QueryResult q) async {
     if (complete(id) || !await available()) return emb[id];
     return _limit<_Sv?>(() async {
     if (complete(id)) return emb[id];
     try {
     final headers = await ScriptManager.runHitomiGetHeaderContent('$id');
     var pages = <String>[];
     try {
     pages = await HitomiImageResolver.getBigThumbnailUrls(
     id,
     ).timeout(const Duration(seconds: 8));
     } catch (_) {}
     final v = emb[id] ?? _Sv(null, null);
     if (v.cover == null) {
     String? url;
     final t = q.thumbnail();
     if (t is String && t.trim().isNotEmpty) {
     final s = t.trim();
     url = s.startsWith('//') ? 'https:$s' : s;
     }
     if (url == null && pages.isNotEmpty) url = pages.first;
     if (url != null) v.cover = await _embedUrl(url, headers);
     }
     if (v.inner == null && pages.length >= 2) {
     final n = pages.length;
     final idx = <int>{};
     if (n >= 5) {
     for (final f in const [0.25, 0.5, 0.75]) {
     idx.add((n * f).floor().clamp(1, n - 2).toInt());
     }
     } else {
     idx.add(1);
     }
     final vecs = await Future.wait([
     for (final i in idx) _embedUrl(pages[i], headers),
     ]);
     v.inner = _mean([
     for (final x in vecs)
     if (x != null) x,
     ]);
     }
     _tried.add(id);
     if (v.cover == null && v.inner == null) {
     emb.remove(id);
     return null;
     }
     emb[id] = v;
     _dirty = true;
     return v;
     } catch (_) {
     _tried.add(id);
     return emb[id];
     }
     });
     }
     static double cos(Int8List a, Int8List b) {
     final n = min(a.length, b.length);
     var dot = 0;
     var na = 0;
     var nb = 0;
     for (var i = 0; i < n; i++) {
     final x = a[i];
     final y = b[i];
     dot += x * y;
     na += x * x;
     nb += y * y;
     }
     if (na == 0 || nb == 0) return 0.0;
     return dot / sqrt(na.toDouble() * nb.toDouble());
     }
     static double sim(_Sv a, _Sv b) {
     var s = 0.0;
     var w = 0.0;
     final ac = a.cover;
     final bc = b.cover;
     if (ac != null && bc != null) {
     s += 0.35 * cos(ac, bc);
     w += 0.35;
     }
     final ai = a.inner;
     final bi = b.inner;
     if (ai != null && bi != null) {
     s += 0.65 * cos(ai, bi);
     w += 0.65;
     }
     return w == 0 ? 0.0 : s / w;
     }
     static Future<File?> _file(String name) async {
     try {
     final dir = (await getApplicationDocumentsDirectory()).path;
     return File('$dir/$name');
     } catch (_) {
     return null;
     }
     }
     static Future<void> load() async {
     if (_loaded) return;
     _loaded = true;
     try {
     final f2 = await _file('ai_style_v2.bin');
     if (f2 != null && await f2.exists()) {
     final b = await f2.readAsBytes();
     final bd = ByteData.sublistView(b);
     var o = 0;
     while (o + 7 <= b.length) {
     final id = bd.getUint32(o, Endian.little);
     final flags = b[o + 4];
     final n = bd.getUint16(o + 5, Endian.little);
     o += 7;
     final need = ((flags & 1) != 0 ? n : 0) + ((flags & 2) != 0 ? n : 0);
     if (n == 0 || o + need > b.length) break;
     Int8List? cover;
     Int8List? inner;
     if ((flags & 1) != 0) {
     cover = Int8List.fromList(b.sublist(o, o + n));
     o += n;
     }
     if ((flags & 2) != 0) {
     inner = Int8List.fromList(b.sublist(o, o + n));
     o += n;
     }
     emb[id] = _Sv(cover, inner);
     }
     return;
     }
     final f1 = await _file('ai_style_v1.bin');
     if (f1 == null || !await f1.exists()) return;
     final b = await f1.readAsBytes();
     final bd = ByteData.sublistView(b);
     var o = 0;
     while (o + 6 <= b.length) {
     final id = bd.getUint32(o, Endian.little);
     final n = bd.getUint16(o + 4, Endian.little);
     o += 6;
     if (n == 0 || o + n > b.length) break;
     emb[id] = _Sv(Int8List.fromList(b.sublist(o, o + n)), null);
     o += n;
     }
     _dirty = true;
     } catch (_) {}
     }
     static Future<void> save() async {
     if (!_dirty) return;
     _dirty = false;
     try {
     while (emb.length > 4000) {
     emb.remove(emb.keys.first);
     }
     var total = 0;
     for (final v in emb.values) {
     total += 7 + (v.cover?.length ?? 0) + (v.inner?.length ?? 0);
     }
     final out = Uint8List(total);
     final bd = ByteData.sublistView(out);
     var o = 0;
     for (final e in emb.entries) {
     final c = e.value.cover;
     final i = e.value.inner;
     final n = c?.length ?? i?.length ?? 0;
     final ok = n > 0 && (c == null || c.length == n) && (i == null || i.length == n);
     if (!ok) continue;
     bd.setUint32(o, e.key, Endian.little);
     out[o + 4] = (c != null ? 1 : 0) | (i != null ? 2 : 0);
     bd.setUint16(o + 5, n, Endian.little);
     o += 7;
     for (final part in [c, i]) {
     if (part == null) continue;
     for (var k = 0; k < n; k++) {
     out[o + k] = part[k] & 0xFF;
     }
     o += n;
     }
     }
     final f = await _file('ai_style_v2.bin');
     if (f == null) return;
     await f.writeAsBytes(Uint8List.sublistView(out, 0, o), flush: true);
     } catch (_) {}
     }
     }
     class TasteRecommendPage extends StatefulWidget {
     const TasteRecommendPage({super.key});
     @override
     State<TasteRecommendPage> createState() => _TasteRecommendPageState();
     }
     enum _Mode { taste, recent }
     enum _Src { ai, tag, artist, similar, related }
     class _Cand {
     _Cand(this.id, this.q, this.bonus, this.reason, this.src);
     final int id;
     final QueryResult q;
     final double bonus;
     final String reason;
     final _Src src;
     String label = '';
     bool explore = false;
     double? style;
     }
     class _Sample {
     _Sample(this.f, this.y, this.w);
     final List<String> f;
     final double y;
     final double w;
     }
     class _TasteModel {
     final Map<String, double> w = {};
     final Map<String, double> prior = {};
     final Map<String, int> support = {};
     double b = 0;
     bool trained = false;
     double value(String k) => w[k] ?? prior[k] ?? 0.0;
     static double sig(double z) => 1 / (1 + exp(-z));
     double logit(List<String> f) {
     if (f.isEmpty) return b;
     final x = 1 / sqrt(f.length);
     var z = b;
     for (final k in f) {
     z += value(k) * x;
     }
     return z;
     }
     void _step(List<String> f, double y, double sw, double lr, double l2) {
     if (f.isEmpty) return;
     final x = 1 / sqrt(f.length);
     final g = (sig(logit(f)) - y) * sw;
     b -= lr * g * 0.2;
     for (final k in f) {
     final cur = value(k);
     final pr = prior[k] ?? 0.0;
     w[k] = cur - lr * (g * x + l2 * (cur - pr));
     }
     }
     Future<void> train(List<_Sample> data, Random rand) async {
     support.clear();
     for (final s in data) {
     for (final k in s.f) {
     support[k] = (support[k] ?? 0) + 1;
     }
     }
     final order = List<int>.generate(data.length, (i) => i);
     for (var e = 0; e < 8; e++) {
     order.shuffle(rand);
     final lr = 0.7 / (1 + e * 0.3);
     for (final i in order) {
     final s = data[i];
     _step(s.f, s.y, s.w, lr, 0.0005);
     }
     await Future<void>.delayed(Duration.zero);
     }
     trained = true;
     }
     void learn(List<String> f, double y) {
     if (f.isEmpty) return;
     final x = 1 / sqrt(f.length);
     final like = y > 0.5;
     for (var i = 0; i < (like ? 4 : 3); i++) {
     final g = (sig(logit(f)) - y) * (like ? 2.5 : 2.0);
     for (final k in f) {
     final cur = value(k);
     final damp = 1 / (1 + (like ? max(0.0, -cur) : max(0.0, cur)));
     w[k] = cur - 0.4 * g * x * damp;
     }
     }
     for (final k in f) {
     support[k] = (support[k] ?? 0) + 1;
     }
     }
     }
     class _Profile {
     final _TasteModel model = _TasteModel();
     final Map<String, double> weights = {};
     final Map<String, dynamic> vec = {};
