     void _rebuildStyleSets() {
     _stylePos.clear();
     _styleNeg.clear();
     void addPos(int id, double w) {
     final e = _Style.emb[id];
     if (e != null) _stylePos.add((e, w));
     }
     void addNeg(int id, double w) {
     final e = _Style.emb[id];
     if (e != null) _styleNeg.add((e, w));
     }
     final seen = <int>{};
     _feedback.forEach((id, v) {
     seen.add(id);
     if (v > 0) {
     addPos(id, 2.0);
     } else {
     addNeg(id, 2.0);
     }
     });
     for (final id in _bookmarkMetas.keys) {
     if (seen.add(id)) addPos(id, 1.0);
     }
     for (final id in _recentReadIds.take(300)) {
     if (!seen.add(id)) continue;
     final g = _engagement(id);
     if (g > 0) addPos(id, 0.7);
     if (g < 0) addNeg(id, 0.5);
     }
     }
     Future<void> _buildStyleProfile() async {
     if (_styleBusy) return;
     _styleBusy = true;
     try {
     await _Style.load();
     _styleAvail = await _Style.available();
     if (!_styleAvail) return;
     final pos = <int, QueryResult>{};
     final neg = <int, QueryResult>{};
     _feedback.forEach((id, v) {
     final q = _fbMetas[id];
     if (q == null) return;
     if (v > 0) {
     pos[id] = q;
     } else {
     neg[id] = q;
     }
     });
     final bms = _bookmarkMetas.entries.toList()..shuffle(_rand);
     for (final e in bms.take(120)) {
     pos.putIfAbsent(e.key, () => e.value);
     }
     var engaged = 0;
     var bounced = 0;
     for (final id in _recentReadIds.take(300)) {
     final q = _readMetas[id];
     if (q == null) continue;
     final g = _engagement(id);
     if (g > 0 && engaged < 40) {
     pos.putIfAbsent(id, () => q);
     engaged++;
     } else if (g < 0 && bounced < 30) {
     neg.putIfAbsent(id, () => q);
     bounced++;
     }
     }
     final todo = [
     for (final e in [...pos.entries, ...neg.entries])
     if (!_Style.complete(e.key)) e,
     ];
     _styleTotal = todo.length;
     _styleDone = 0;
     if (mounted) setState(() {});
     for (var i = 0; i < todo.length; i += 6) {
     if (!mounted || !_styleOn) break;
     await Future.wait([
     for (final e in todo.skip(i).take(6)) _Style.of(e.key, e.value),
     ]);
     _styleDone = min(todo.length, i + 6);
     if (_styleDone % 30 == 0) {
     _rebuildStyleSets();
     _Style.save();
     }
     if (mounted) setState(() {});
     }
     _rebuildStyleSets();
     await _Style.save();
     } catch (_) {
     } finally {
     _styleBusy = false;
     _styleTotal = 0;
     if (mounted) setState(() {});
     }
     }
     double? _styleRaw(_Sv e) {
     if (_stylePos.length < 8) return null;
     double topMean(List<(_Sv, double)> items, int k) {
     final sims = [
     for (final (v, w) in items) _Style.sim(e, v) * (w >= 2 ? 1.05 : 1.0),
     ]..sort((a, b) => b.compareTo(a));
     final n = min(k, sims.length);
     if (n == 0) return 0.0;
     var s = 0.0;
     for (var i = 0; i < n; i++) {
     s += sims[i];
     }
     return s / n;
     }
     final pos = topMean(_stylePos, 5);
     final neg = _styleNeg.length >= 3 ? topMean(_styleNeg, 3) : 0.0;
     return pos - 0.5 * neg;
     }
     Map<int, double> _styleZ(Iterable<_Cand> list) {
     final raw = <int, double>{};
     for (final c in list) {
     final e = _Style.emb[c.id];
     if (e == null) continue;
     final r = _styleRaw(e);
     if (r != null) raw[c.id] = r;
     }
     if (raw.length < 4) return const {};
     final vals = raw.values.toList();
     final mean = vals.reduce((a, b) => a + b) / vals.length;
     var v2 = 0.0;
     for (final x in vals) {
     v2 += (x - mean) * (x - mean);
     }
     final sd = sqrt(v2 / vals.length);
     if (sd < 1e-6) return const {};
     return {
     for (final e in raw.entries)
     e.key: ((e.value - mean) / sd).clamp(-2.5, 2.5).toDouble(),
     };
     }
     String _stylePct(_Cand c) {
     final s = c.style;
     if (s == null) return '';
     return ' · 그림체 ${(_TasteModel.sig(1.3 * s) * 100).round()}%';
     }
     Future<void> _ensureStyle(List<_Cand> list, Duration budget) async {
     final need = [
     for (final c in list)
     if (!_Style.complete(c.id)) c,
     ];
     if (need.isEmpty) return;
     try {
     await Future.wait([
     for (final c in need) _Style.of(c.id, c.q),
     ]).timeout(budget);
     } catch (_) {}
     _Style.save();
     }
     Future<void> _prefetchStyle(_Profile p) async {
     final list = <(_Cand, double)>[];
     for (final c in p.pool.values) {
     if (!_isNew(c.id) || _Style.complete(c.id)) continue;
     list.add((c, p.model.logit(_featsOf(c.id, c.q)) + c.bonus));
     }
     if (list.isEmpty) return;
     list.sort((a, b) => b.$2.compareTo(a.$2));
     await _ensureStyle(
     list.take(30).map((e) => e.$1).toList(),
     const Duration(seconds: 90),
     );
     }
