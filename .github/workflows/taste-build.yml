     Future<void> _loadBackground() async {
     if (!_hasDb) return;
     final span = (_maxId! - _minId!).toDouble();
     final out = <int, QueryResult>{};
     for (var i = 0; i < 3; i++) {
     final before = _maxId! + 1 - (span * pow(_rand.nextDouble(), 2)).toInt();
     try {
     final rows = await QueryManager.queryPagination(
     _and(_withFilters(''), 'Id < $before'),
     300,
     ).next().timeout(const Duration(seconds: 8));
     for (final q in rows) {
     final id = _idOf(q);
     if (id == null ||
     _bookmarkedIds.contains(id) ||
     _readIds.contains(id)) {
     continue;
     }
     out[id] = q;
     }
     } catch (_) {}
     }
     _background = out.values.toList();
     }
     int _engagement(int id) {
     final lp = _readMaxPage[id];
     if (lp == null) return 0;
     final q = _readMetas[id];
     final pages = q == null ? null : _knownPagesOf(id, q);
     if (pages != null) {
     if (lp + 1 >= pages * 0.7) return 1;
     if (lp + 1 <= max(3, pages * 0.2)) return -1;
     return 0;
     }
     if (lp >= 20) return 1;
     if (lp <= 2) return -1;
     return 0;
     }
     int? _knownPagesOf(int id, QueryResult q) {
